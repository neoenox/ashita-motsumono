name: ashita_motsumono
version: 0.7.0+7
publish_to: 'none'
description: 園・学校・習い事のプリントから今日・明日の持ち物/提出物/集金をTodo化するMVP。

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  image_picker: ^1.2.1
  google_mlkit_text_recognition: ^0.15.1
  flutter_local_notifications: ^22.0.1
  app_settings: ^9.0.0
  flutter_timezone: ^5.1.0
  timezone: ^0.11.1
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.2
  intl: ^0.20.2
  drift: ^2.34.0
  sqlite3_flutter_libs: ^0.6.0
  google_mobile_ads: ^9.0.0
  characters: ^1.4.1
  in_app_purchase: ^3.3.0
  url_launcher: ^6.3.1
  http: ^1.3.0
  crypto: ^3.0.3
  receive_sharing_intent: 1.8.1 # 1.9.0 requires Android SDK 37 / AGP 9.2.1
  # Keep 10.3.10 until file_picker #1973's Android Kotlin plugin regression is fixed.
  file_picker: 10.3.10
  pdfx: ^2.9.2

dev_dependencies:
  drift_dev: ^2.34.5
  build_runner: ^2.15.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP.ttf
