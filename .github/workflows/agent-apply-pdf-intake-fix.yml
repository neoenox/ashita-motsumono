name: Apply PDF intake feedback fix

on:
  push:
    branches:
      - feature/pdf-intake

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/pdf-intake

      - name: Restore requested feedback and remove workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/src/screens/add_todo_screen_actions.dart')
          source = path.read_text(encoding='utf-8')
          old = """        ScaffoldMessenger.of(context).showSnackBar(
          const SnackBar(
            content: Text('文字は読み取れましたがTodo候補が見つかりませんでした'),
          ),
        );"""
          new = """        ScaffoldMessenger.of(
          context,
        ).showSnackBar(const SnackBar(content: Text('候補が見つかりませんでした')));"""
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one target block, found {source.count(old)}')
          path.write_text(source.replace(old, new), encoding='utf-8')
          Path('.github/workflows/agent-apply-pdf-intake-fix.yml').unlink()
          PY
          dart format lib/src/screens/add_todo_screen_actions.dart

      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/src/screens/add_todo_screen_actions.dart .github/workflows/agent-apply-pdf-intake-fix.yml
          git commit -m "fix: restore requested PDF no-candidate feedback"
          git push origin HEAD:feature/pdf-intake
