name: PR Validation Diagnostics

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/pr-analyze-diagnostics.yml'

permissions:
  contents: read

jobs:
  validation-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Capture analyze report
        id: analyze
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee analyze-report.txt

      - name: Capture test report
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee test-report.txt

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            analyze-report.txt
            test-report.txt
          if-no-files-found: error
          retention-days: 3

      - name: Enforce validation result
        if: steps.analyze.outcome == 'failure' || steps.tests.outcome == 'failure'
        run: exit 1
