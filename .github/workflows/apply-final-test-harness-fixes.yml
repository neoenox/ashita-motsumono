name: Apply Final Test Harness Fixes

on:
  push:
    branches:
      - agent/full-source-hardening
    paths:
      - .github/workflows/apply-final-test-harness-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/full-source-hardening
          fetch-depth: 0

      - name: Patch widget and screenshot test harnesses
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          widget = Path('test/widget_test.dart')
          widget_text = widget.read_text(encoding='utf-8')
          widget_replacements = [
              (
                  "expect(find.text('買い切り ¥190'), findsOneWidget);",
                  "expect(find.text('買い切り ¥190'), findsNWidgets(2));",
              ),
              (
                  "expect(find.text('購入アイテムを準備中です。しばらくしてからもう一度お試しください。'), findsOneWidget);",
                  "expect(find.text('購入アイテムを準備中です。しばらくしてからもう一度お試しください。'), findsNWidgets(2));",
              ),
          ]
          for old, new in widget_replacements:
              count = widget_text.count(old)
              if count != 1:
                  raise SystemExit(f'{widget}: expected one match, found {count}: {old!r}')
              widget_text = widget_text.replace(old, new)
          widget.write_text(widget_text, encoding='utf-8')

          screenshots = Path('tool/generate_lp_screenshots_test.dart')
          screenshot_text = screenshots.read_text(encoding='utf-8')
          fake_service = '''class _ScreenshotNotificationService extends NotificationService {
            _ScreenshotNotificationService() : super(timezoneName: 'Asia/Tokyo');

            @override
            Future<void> initialize() async {}

            @override
            Future<void> requestPermissions() async {}

            @override
            Future<void> scheduleTodo(AppTodo todo) async {}

            @override
            Future<void> cancelTodo(String todoId) async {}
          }

          '''
          marker = 'Future<AppSettings> _createSettings() async {'
          if screenshot_text.count(marker) != 1:
              raise SystemExit('screenshot settings marker was not unique')
          screenshot_text = screenshot_text.replace(marker, fake_service + marker)

          old_service = "notifications: NotificationService(timezoneName: 'Asia/Tokyo'),"
          if screenshot_text.count(old_service) != 1:
              raise SystemExit('screenshot notification service marker was not unique')
          screenshot_text = screenshot_text.replace(
              old_service,
              'notifications: _ScreenshotNotificationService(),',
          )

          old_setup = '''  setUp(() {
            // このファイルはtool配下だが、CIではflutter testから実行するテスト専用コード。
            // ignore: invalid_use_of_visible_for_testing_member
            SharedPreferences.setMockInitialValues({
              'notification_info_shown_v1': true,
            });
          });'''
          new_setup = '''  setUp(() {
            final messenger =
                TestDefaultBinaryMessengerBinding.instance.defaultBinaryMessenger;
            const messagesChannel = MethodChannel(
              'receive_sharing_intent/messages',
            );
            const eventsChannel = MethodChannel(
              'receive_sharing_intent/events-media',
            );
            messenger.setMockMethodCallHandler(
              messagesChannel,
              (call) async => <dynamic>[],
            );
            messenger.setMockMethodCallHandler(
              eventsChannel,
              (call) async => null,
            );
            addTearDown(() {
              messenger.setMockMethodCallHandler(messagesChannel, null);
              messenger.setMockMethodCallHandler(eventsChannel, null);
            });

            // このファイルはtool配下だが、CIではflutter testから実行するテスト専用コード。
            // ignore: invalid_use_of_visible_for_testing_member
            SharedPreferences.setMockInitialValues({
              'notification_info_shown_v1': true,
            });
          });'''
          if screenshot_text.count(old_setup) != 1:
              raise SystemExit('screenshot setUp block was not found exactly once')
          screenshot_text = screenshot_text.replace(old_setup, new_setup)
          screenshots.write_text(screenshot_text, encoding='utf-8')
          PY

          rm .github/workflows/apply-final-test-harness-fixes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test/widget_test.dart tool/generate_lp_screenshots_test.dart .github/workflows/apply-final-test-harness-fixes.yml
          git commit -m "test: isolate settings and screenshot harnesses from platform plugins"
          git push origin HEAD:agent/full-source-hardening
