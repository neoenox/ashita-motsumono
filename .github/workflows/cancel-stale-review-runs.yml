name: Cancel stale review CI

on:
  push:
    branches:
      - agent/complete-source-review-fixes-v2

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale-flutter-ci:
    runs-on: windows-latest
    steps:
      - name: Cancel stale Flutter CI runs on review branch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          API_URL: ${{ github.api_url }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $uri = "$env:API_URL/repos/$env:REPOSITORY/actions/runs?branch=$([uri]::EscapeDataString($env:BRANCH))&per_page=100"
          $response = Invoke-RestMethod -Uri $uri -Headers $headers -Method Get
          $runs = $response.workflow_runs | Where-Object {
            $_.name -eq 'Flutter CI' -and
            ($_.status -eq 'queued' -or $_.status -eq 'in_progress')
          }
          foreach ($run in $runs) {
            Write-Host "Cancelling Flutter CI run $($run.id) ($($run.status))"
            try {
              Invoke-RestMethod \
                -Uri "$env:API_URL/repos/$env:REPOSITORY/actions/runs/$($run.id)/cancel" \
                -Headers $headers \
                -Method Post
            } catch {
              Write-Warning "Could not cancel run $($run.id): $($_.Exception.Message)"
            }
          }
