name: Cancel stale review CI

on:
  push:
    branches:
      - agent/complete-source-review-fixes-v2

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale-flutter-ci:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-slim
          - ubuntu-24.04-arm
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Cancel stale Flutter CI runs on review branch
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            core.info(`Checking stale Flutter CI runs for ${branch}`);
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch,
                per_page: 100,
              },
            );

            for (const run of runs) {
              if (
                run.name === 'Flutter CI' &&
                (run.status === 'queued' || run.status === 'in_progress')
              ) {
                core.info(`Cancelling Flutter CI run ${run.id} (${run.status})`);
                try {
                  await github.rest.actions.cancelWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id,
                  });
                } catch (error) {
                  core.warning(
                    `Could not cancel run ${run.id}: ${error.message}`,
                  );
                }
              }
            }
