name: Apply PDF intake P0 fixes (PR)

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pdf-intake
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Extract and apply implementation
        shell: bash
        run: |
          ruby -ryaml -e 'print YAML.load_file(".github/workflows/apply-pdf-intake-p0.yml").dig("jobs", "apply-fixes", "steps")[2]["run"]' > /tmp/apply-pdf-intake.sh
          bash /tmp/apply-pdf-intake.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: |
          dart format \
            lib/src/services/document_intake_service.dart \
            lib/src/services/pdf_render_service.dart \
            lib/src/services/image_file_service.dart \
            lib/src/services/receive_share_handler.dart \
            lib/src/repositories/app_database.dart \
            test/app_database_test.dart \
            test/database_schema_migration_test.dart \
            test/document_intake_service_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run targeted tests
        run: |
          flutter test test/document_intake_service_test.dart
          flutter test test/app_database_test.dart
          flutter test test/database_schema_migration_test.dart

      - name: Run full test suite
        run: flutter test

      - name: Commit and push fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch \
            .github/workflows/apply-pdf-intake-p0.yml \
            .github/workflows/apply-pdf-intake-p0-pr.yml
          git add -A
          git diff --cached --stat
          git commit -m "fix: harden PDF intake persistence"
          git push origin HEAD:feature/pdf-intake
