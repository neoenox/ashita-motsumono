name: Diagnose Share Intake

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  flutter-test-log:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run full test suite with captured output
        id: tests
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded 2>&1 | tee flutter-test.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload Flutter test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: share-intake-flutter-test-log
          path: flutter-test.log
          if-no-files-found: error
          retention-days: 1
