name: Apply full review fixes

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.head_ref == 'agent/complete-source-review-fixes-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply reviewed fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tool/apply_full_review_fixes.py')
          content = path.read_text(encoding='utf-8')
          content = content.replace('pendingSuccess!);', 'pendingSuccess);')
          path.write_text(content, encoding='utf-8')
          PY
          python3 tool/apply_full_review_fixes.py
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              content = target.read_text(encoding='utf-8')
              if old not in content:
                  if new in content:
                      return
                  raise RuntimeError(f'{path}: expected text not found')
              target.write_text(content.replace(old, new, 1), encoding='utf-8')

          replace(
              'lib/src/screens/home_screen.dart',
              "import 'dart:convert';\n",
              "import 'dart:convert';\nimport 'dart:io' show Platform;\n",
          )
          replace(
              'lib/src/screens/home_screen.dart',
              "    _initShareIntentListener();\n",
              "    if (Platform.isAndroid || Platform.isIOS) {\n"
              "      _initShareIntentListener();\n"
              "    }\n",
          )
          replace(
              'lib/src/screens/home_screen_scope.dart',
              "import 'dart:async';\n\nimport 'package:flutter/foundation.dart';\n",
              "import 'dart:async';\nimport 'dart:io' show Platform;\n\n",
          )
          replace(
              'lib/src/screens/home_screen_scope.dart',
              "    if (_recoveryStarted || defaultTargetPlatform != TargetPlatform.android) {\n",
              "    if (_recoveryStarted || !Platform.isAndroid) {\n",
          )
          replace(
              'test/widget_test.dart',
              "  final tempDir = await Directory.systemTemp.createTemp('ashita_widget_test_');\n",
              "  final tempDir = Directory(\n"
              "    'build/widget_test_temp/'\n"
              "    '${DateTime.now().microsecondsSinceEpoch}',\n"
              "  );\n"
              "  await tempDir.create(recursive: true);\n",
          )
          PY
          dart format lib/src/screens/home_screen.dart lib/src/screens/home_screen_scope.dart test/widget_test.dart

      - name: Run targeted widget test
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/review-fix-validation
          timeout 120s flutter test test/widget_test.dart \
            --plain-name 'HomeScreen shows empty state when children exist but no todos' \
            --reporter expanded 2>&1 | tee build/review-fix-validation/widget-targeted.log

      - name: Upload targeted log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-review-widget-targeted
          path: build/review-fix-validation
          if-no-files-found: warn
          retention-days: 7
