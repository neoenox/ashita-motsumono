name: Format PR 133 JVM compatibility test

on:
  push:
    branches:
      - fix/v0.6.3-release-gate
    paths:
      - .github/workflows/pr-133-format-jvm-test.yml

permissions:
  contents: write
  statuses: write

jobs:
  format-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish formatter status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -n \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:"pending", target_url:$target_url, description:"Formatting JVM compatibility test", context:"pr-133-jvm-test-format"}' \
            > status.json
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --input status.json

      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: fix/v0.6.3-release-gate
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Format and run regression test
        shell: bash
        run: |
          set -euo pipefail
          dart format test/configure_android_plugin_jvm_test.dart
          flutter pub get
          flutter test test/configure_android_plugin_jvm_test.dart

      - name: Commit formatter changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- test/configure_android_plugin_jvm_test.dart; then
            echo 'Regression test is already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/configure_android_plugin_jvm_test.dart
          git commit -m 'style: format Android JVM compatibility test'
          git pull --rebase origin fix/v0.6.3-release-gate
          git push origin HEAD:fix/v0.6.3-release-gate

      - name: Publish formatter success
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -n \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:"success", target_url:$target_url, description:"JVM compatibility test formatted and passed", context:"pr-133-jvm-test-format"}' \
            > status.json
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --input status.json
