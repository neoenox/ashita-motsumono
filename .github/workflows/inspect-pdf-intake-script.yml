name: Inspect PDF intake script

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pdf-intake
          fetch-depth: 0
      - name: Inspect delimiters
        run: |
          ruby -ryaml -e 'print YAML.load_file(".github/workflows/apply-pdf-intake-p0.yml").dig("jobs", "apply-fixes", "steps")[2]["run"]' > /tmp/apply.sh
          python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/apply.sh').read_text()
          start = text.index("replace_once(\n    'lib/src/repositories/app_database.dart',\n    '''  Future<void> _migrateToV3")
          end = text.index("\n)\n\nreplace_once(\n    'lib/src/services/receive_share_handler.dart'", start)
          block = text[start:end]
          out = [
              'TAIL_REPR=' + repr(block[-600:]),
              'TRIPLE_POSITIONS=' + repr([i for i in range(len(block)) if block.startswith("'''", i)]),
          ]
          Path('/tmp/inspect.log').write_text('\n'.join(out))
          PY
      - name: Commit inspection
        run: |
          git reset --hard HEAD
          cp /tmp/inspect.log .github/pdf-intake-script-inspect.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/pdf-intake-script-inspect.log
          git commit -m "chore: record PDF intake delimiter inspection"
          git push origin HEAD:feature/pdf-intake
