name: Gemini Proxy Worker CI

on:
  pull_request:
    paths:
      - 'workers/gemini-proxy/**'
      - '.github/workflows/worker-ci.yml'
  push:
    branches:
      - master
    paths:
      - 'workers/gemini-proxy/**'
      - '.github/workflows/worker-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-quality:
    name: Worker typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workers/gemini-proxy
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workers/gemini-proxy/package.json

      - name: Install test toolchain
        run: npm install --no-audit --no-fund

      - name: Typecheck Worker
        run: npm run typecheck

      - name: Run Worker tests
        run: npm test

      - name: Verify validated entrypoint is deployed
        run: grep -Fq 'main = "src/validated.ts"' wrangler.toml
