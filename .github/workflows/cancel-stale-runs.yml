name: Cancel stale pull request runs

on:
  push:
    branches:
      - ops/cancel-stale-actions

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale-runs:
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SELF_RUN_ID: ${{ github.run_id }}
      KEEP_SHA: d4a308f50a6d5061aa8407716f114d1eba8b4879
      REPOSITORY: ${{ github.repository }}
      API_URL: ${{ github.api_url }}
    steps:
      - name: Cancel stale runs from superseded branches
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $staleBranches = @(
            'fix/v0.6.3-release-gate',
            'fix/close-home-screen-appstate-tests',
            'agent/clarify-release-priority',
            'ops/cancel-stale-actions'
          )
          $cancelled = 0
          foreach ($status in @('in_progress', 'queued')) {
            $url = "$env:API_URL/repos/$env:REPOSITORY/actions/runs?status=$status&per_page=100"
            $payload = Invoke-RestMethod -Uri $url -Headers $headers -Method Get
            foreach ($run in $payload.workflow_runs) {
              $runId = [string]$run.id
              if ($runId -eq $env:SELF_RUN_ID) { continue }
              if ($staleBranches -notcontains [string]$run.head_branch) { continue }
              if ([string]$run.head_sha -eq $env:KEEP_SHA) { continue }
              $cancelUrl = "$env:API_URL/repos/$env:REPOSITORY/actions/runs/$runId/cancel"
              try {
                Invoke-RestMethod -Uri $cancelUrl -Headers $headers -Method Post | Out-Null
                Write-Host "cancel requested: $runId $($run.head_branch) $($run.head_sha)"
                $cancelled++
              } catch {
                if ($_.Exception.Response.StatusCode.value__ -notin @(404, 409)) { throw }
              }
            }
          }
          Write-Host "cancelled_or_already_finishing=$cancelled"
