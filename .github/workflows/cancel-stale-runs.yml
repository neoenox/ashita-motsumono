name: Cancel stale pull request runs

on:
  push:
    branches:
      - ops/cancel-stale-actions

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale-runs:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SELF_RUN_ID: ${{ github.run_id }}
      KEEP_SHA: d4a308f50a6d5061aa8407716f114d1eba8b4879
      REPOSITORY: ${{ github.repository }}
      API_URL: ${{ github.api_url }}
    steps:
      - name: Cancel stale runs from superseded branches
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          api_url = os.environ['API_URL']
          repository = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          self_run_id = int(os.environ['SELF_RUN_ID'])
          keep_sha = os.environ['KEEP_SHA']
          stale_branches = {
              'fix/v0.6.3-release-gate',
              'fix/close-home-screen-appstate-tests',
              'agent/clarify-release-priority',
          }
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'ashita-motsumono-stale-run-cleanup',
          }

          def request(url, *, method='GET'):
              req = urllib.request.Request(url, data=b'' if method == 'POST' else None, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read()
                      return response.status, json.loads(body) if body else None
              except urllib.error.HTTPError as error:
                  body = error.read().decode('utf-8', errors='replace')
                  if error.code in {404, 409}:
                      return error.code, None
                  raise RuntimeError(f'{method} {url} failed: {error.code} {body}') from error

          cancelled = []
          for status in ('in_progress', 'queued'):
              url = f'{api_url}/repos/{repository}/actions/runs?status={status}&per_page=100'
              _, payload = request(url)
              for run in payload.get('workflow_runs', []):
                  run_id = int(run['id'])
                  branch = run.get('head_branch')
                  sha = run.get('head_sha')
                  if run_id == self_run_id or branch not in stale_branches or sha == keep_sha:
                      continue
                  cancel_url = f'{api_url}/repos/{repository}/actions/runs/{run_id}/cancel'
                  code, _ = request(cancel_url, method='POST')
                  if code in {202, 409}:
                      cancelled.append(run_id)
                      print(f'cancel requested: {run_id} {branch} {sha}')

          print(f'cancelled_or_already_finishing={len(cancelled)}')
          PY
