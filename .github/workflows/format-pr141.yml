name: Format PR 141 files

on:
  push:
    branches: [feature/ump-consent]

permissions:
  contents: write

concurrency:
  group: format-pr141
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ump-consent
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
      - run: |
          dart format \
            lib/src/bootstrap_app.dart \
            lib/src/services/consent_service.dart \
            test/services/consent_service_test.dart
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            lib/src/bootstrap_app.dart \
            lib/src/services/consent_service.dart \
            test/services/consent_service_test.dart
          git commit -m 'style: apply dart format to UMP consent flow'
          git push origin HEAD:feature/ump-consent
