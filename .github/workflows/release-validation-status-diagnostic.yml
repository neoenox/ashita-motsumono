name: Release Validation Status Diagnostic

on:
  pull_request:
    paths:
      - 'tool/release_validation_control.ps1'
      - 'tool/release_validation_session.ps1'
      - '.github/workflows/release-validation-status-diagnostic.yml'

permissions:
  contents: write

jobs:
  apply-status-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: agent/release-validation-hardening
          fetch-depth: 0

      - name: Make git reads exception-safe
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old = '''  Push-Location $RepoRoot
  try {
    $value = & git @Arguments 2>$null
    if ($LASTEXITCODE -ne 0) {
      return ''
    }
    ($value | Out-String).Trim()
  }
  finally {
    Pop-Location
  }
'''
          new = '''  Push-Location $RepoRoot
  try {
    try {
      $value = & git @Arguments 2>$null
    }
    catch {
      return ''
    }
    if ($LASTEXITCODE -ne 0) {
      return ''
    }
    ($value | Out-String).Trim()
  }
  finally {
    Pop-Location
  }
'''
          changed = []
          for name in (
              'tool/release_validation_control.ps1',
              'tool/release_validation_session.ps1',
          ):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f'Get-GitValue anchor missing: {name}')
              path.write_text(
                  text.replace(old, new, 1),
                  encoding='utf-8',
                  newline='\n',
              )
              changed.append(name)
          print('\n'.join(changed) if changed else 'already applied')
          PY

      - name: Commit correction
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No correction required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tool/release_validation_control.ps1 \
            tool/release_validation_session.ps1
          git commit -m 'fix: tolerate missing git refs in release status'
          git push origin HEAD:agent/release-validation-hardening
