name: Apply UI improvements

on:
  push:
    branches:
      - feat/adaptive-navigation-motion

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/adaptive-navigation-motion

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply guarded source changes
        run: python3 tool/apply_ui_improvements.py

      - name: Format changed Dart files
        run: |
          dart format \
            lib/src/app_navigation.dart \
            lib/src/theme/app_theme.dart \
            lib/src/screens/widgets/todo_tile.dart \
            lib/src/screens/home_screen.dart \
            lib/src/screens/home_screen_scope.dart \
            lib/src/screens/add_todo_screen.dart \
            lib/src/screens/todo_detail_screen.dart \
            lib/src/screens/review_extractions_screen.dart \
            lib/src/bootstrap_app.dart

      - name: Verify formatting diff
        run: git diff --check

      - name: Analyze without fetching packages
        run: flutter analyze --no-pub

      - name: Remove temporary automation files
        run: |
          rm tool/apply_ui_improvements.py
          rm .github/workflows/apply-ui-improvements.yml

      - name: Commit verified implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add adaptive navigation and reduced motion'
          git push origin HEAD:feat/adaptive-navigation-motion
