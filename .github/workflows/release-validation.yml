name: Flutter Release Validation

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ADMOB_APP_ID: ca-app-pub-3940256099942544~3347511713
      CI_KEYSTORE_PASSWORD: ashita-ci-release
      CI_KEY_ALIAS: ashita-ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply formatting
        shell: bash
        run: |
          set -euo pipefail
          dart format .
          if git diff --quiet -- '*.dart'; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- '*.dart'
          git commit -m "style: format Dart sources"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          exit 1

      - name: Analyze
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/ci-diagnostics
          python3 tool/run_flutter_analyze.py 2>&1 | tee build/ci-diagnostics/flutter-analyze.log

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/ci-diagnostics
          flutter test 2>&1 | tee build/ci-diagnostics/flutter-test.log

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ashita-motsumono-validation-diagnostics-${{ github.sha }}
          path: build/ci-diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Generate Android platform files
        run: bash tool/create_platforms.sh

      - name: Apply Android release configuration
        run: bash tool/configure_android_release.sh

      - name: Install regenerated platform dependencies
        run: flutter pub get

      - name: Create ephemeral CI release keystore
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair \
            -keystore android/app/ci-release-keystore.jks \
            -storepass "$CI_KEYSTORE_PASSWORD" \
            -keypass "$CI_KEYSTORE_PASSWORD" \
            -alias "$CI_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=Ashita Motsumono CI, OU=CI, O=Apunoki, L=Kumagaya, ST=Saitama, C=JP"
          cat > android/key.properties <<EOF
          storeFile=app/ci-release-keystore.jks
          storePassword=$CI_KEYSTORE_PASSWORD
          keyAlias=$CI_KEY_ALIAS
          keyPassword=$CI_KEYSTORE_PASSWORD
          EOF

      - name: Build release APK
        run: >
          flutter build apk --release
          --dart-define=ADMOB_BANNER_AD_UNIT_ID=ca-app-pub-3940256099942544/6300978111
          --dart-define=IAP_REMOVE_ADS_PRODUCT_ID=ci.remove_ads
          --dart-define=IAP_AI_ACCESS_PRODUCT_ID=ci.ai_analysis
          --dart-define=GEMINI_PROXY_URL=https://example.invalid

      - name: Build release AAB
        run: >
          flutter build appbundle --release
          --dart-define=ADMOB_BANNER_AD_UNIT_ID=ca-app-pub-3940256099942544/6300978111
          --dart-define=IAP_REMOVE_ADS_PRODUCT_ID=ci.remove_ads
          --dart-define=IAP_AI_ACCESS_PRODUCT_ID=ci.ai_analysis
          --dart-define=GEMINI_PROXY_URL=https://example.invalid

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          aab=build/app/outputs/bundle/release/app-release.aab
          test -s "$apk"
          test -s "$aab"
          sha256sum "$apk" "$aab" | tee build/release-smoke-sha256.txt

      - name: Upload release validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ashita-motsumono-release-validation-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            build/release-smoke-sha256.txt
          if-no-files-found: error
          retention-days: 7
