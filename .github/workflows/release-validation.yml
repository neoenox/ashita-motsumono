name: Flutter Release Validation

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/pdf-intake
          fetch-depth: 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Format and push regression test
        shell: bash
        run: |
          set -euo pipefail
          dart format test/intake_progress_overlay_test.dart
          git fetch origin master --depth=1
          git checkout origin/master -- .github/workflows/release-validation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test/intake_progress_overlay_test.dart .github/workflows/release-validation.yml
          git commit -m 'style: format intake progress regression test'
          git push origin HEAD:feature/pdf-intake
