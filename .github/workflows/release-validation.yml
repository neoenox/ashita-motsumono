name: Flutter Release Validation

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/pdf-intake
          fetch-depth: 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Resolve pinned dependencies and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          grep -A6 '^  file_picker:' pubspec.lock
          grep -A6 '^  file_picker_android:' pubspec.lock

          git fetch origin master --depth=1
          git checkout origin/master -- .github/workflows/release-validation.yml

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pubspec.lock .github/workflows/release-validation.yml
          git commit -m 'build: lock Android-compatible file picker'
          git push origin HEAD:feature/pdf-intake
