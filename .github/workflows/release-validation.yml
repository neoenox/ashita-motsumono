name: Flutter Release Validation

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/pdf-intake
          fetch-depth: 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply cancellation hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_checked(path: str, old: str, new: str, expected: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f'{path}: {old!r}: expected {expected}, found {actual}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          actions = 'lib/src/screens/add_todo_screen_actions.dart'
          replace_checked(actions, '          current: 0,\n          total: picked.length,',
                          '          current: 1,\n          total: picked.length,')
          replace_checked(actions,
                          '    if (token == null || token.isCancelled) return;\n    token.cancel();',
                          '    if (token == null || token.isCancelled) return;\n'
                          '    if (_intakeProgress?.stage == IntakeProgressStage.saving) return;\n'
                          '    token.cancel();')

          overlay = 'lib/src/widgets/intake_progress_overlay.dart'
          replace_checked(overlay,
                          '    final cs = Theme.of(context).colorScheme;\n'
                          "    final message = cancelling ? 'キャンセルしています...' : progress.message;",
                          '    final cs = Theme.of(context).colorScheme;\n'
                          '    final isSaving = progress.stage == IntakeProgressStage.saving;\n'
                          "    final message = cancelling ? 'キャンセルしています...' : progress.message;")
          replace_checked(overlay,
                          "                        '処理中はこの画面を閉じないでください。',",
                          "                        isSaving\n"
                          "                            ? '保存中はキャンセルできません。'\n"
                          "                            : '処理中はこの画面を閉じないでください。',")
          replace_checked(overlay,
                          '                        onPressed: cancelling ? null : onCancel,',
                          '                        onPressed: cancelling || isSaving ? null : onCancel,')
          replace_checked(overlay,
                          "                        label: Text(cancelling ? 'キャンセル中' : 'キャンセル'),",
                          "                        label: Text(\n"
                          "                          cancelling\n"
                          "                              ? 'キャンセル中'\n"
                          "                              : isSaving\n"
                          "                              ? '保存中'\n"
                          "                              : 'キャンセル',\n"
                          "                        ),")

          service = 'lib/src/services/document_intake_service.dart'
          replace_checked(service,
                          '        final document = await _saveDocumentWithPages(',
                          '        cancellationToken?.throwIfCancelled();\n'
                          '        final document = await _saveDocumentWithPages(',
                          expected=2)
          replace_checked(service,
                          '          pageResults: pageResults,\n        );',
                          '          pageResults: pageResults,\n'
                          '          cancellationToken: cancellationToken,\n'
                          '        );',
                          expected=2)
          replace_checked(service,
                          '    String? sourceFingerprint,\n  }) async {',
                          '    String? sourceFingerprint,\n'
                          '    IntakeCancellationToken? cancellationToken,\n'
                          '  }) async {')
          replace_checked(service,
                          '    try {\n      for (final pageResult in pageResults) {\n'
                          '        final extension = _supportedExtension(pageResult.imageFile.path);',
                          '    try {\n      cancellationToken?.throwIfCancelled();\n'
                          '      for (final pageResult in pageResults) {\n'
                          '        cancellationToken?.throwIfCancelled();\n'
                          '        final extension = _supportedExtension(pageResult.imageFile.path);')
          replace_checked(service,
                          '      await _appState.addDocumentRecord(document);\n      return document;',
                          '      cancellationToken?.throwIfCancelled();\n'
                          '      await _appState.addDocumentRecord(document);\n'
                          '      if (cancellationToken?.isCancelled ?? false) {\n'
                          '        await _appState.deleteDocument(document.id);\n'
                          '        throw const IntakeCancelledException();\n'
                          '      }\n'
                          '      return document;')

          test_file = Path('test/document_intake_service_test.dart')
          text = test_file.read_text(encoding='utf-8')
          anchor = "  test('removes copied images when database persistence fails', () async {"
          if text.count(anchor) != 1:
              raise SystemExit('document intake test anchor mismatch')
          test = '''  test('rolls back when cancellation is requested before saving', () async {
            final tempDir = await Directory.systemTemp.createTemp(
              'document_intake_cancel_saving_',
            );
            final (state, settings) = await _createState();
            addTearDown(() async {
              await state.close();
              state.dispose();
              if (await tempDir.exists()) {
                await tempDir.delete(recursive: true);
              }
            });

            final source = File('${tempDir.path}/source.jpg')
              ..writeAsBytesSync([1, 2, 3]);
            final token = IntakeCancellationToken();
            final service = DocumentIntakeService(
              appState: state,
              appSettings: settings,
              ocrService: _QueueOcrService(['持ち物 水筒']),
              temporaryDirectoryProvider: () async => tempDir,
              documentsDirectoryProvider: () async => tempDir,
            );

            final result = await service.importImages(
              sourcePaths: [source.path],
              sourceType: 'gallery',
              cancellationToken: token,
              onProgress: (entry) {
                if (entry.stage == IntakeProgressStage.saving) {
                  token.cancel();
                }
              },
            );

            expect(result, isA<IntakeError>());
            expect(
              (result as IntakeError).message,
              DocumentIntakeService.cancelledMessage,
            );
            expect(state.documents, isEmpty);
            final imagesDir = Directory('${tempDir.path}/document_images');
            final remaining = await imagesDir.exists()
                ? await imagesDir.list().toList()
                : const <FileSystemEntity>[];
            expect(remaining, isEmpty);
          });

          '''
          test_file.write_text(text.replace(anchor, test + anchor), encoding='utf-8')
          PY

          dart format \
            lib/src/screens/add_todo_screen_actions.dart \
            lib/src/widgets/intake_progress_overlay.dart \
            lib/src/services/document_intake_service.dart \
            test/document_intake_service_test.dart

          git fetch origin master --depth=1
          git checkout origin/master -- .github/workflows/release-validation.yml

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            lib/src/screens/add_todo_screen_actions.dart \
            lib/src/widgets/intake_progress_overlay.dart \
            lib/src/services/document_intake_service.dart \
            test/document_intake_service_test.dart \
            .github/workflows/release-validation.yml
          git commit -m 'fix: make intake cancellation rollback-safe'
          git push origin HEAD:feature/pdf-intake

      - name: Analyze patched tree
        run: python3 tool/run_flutter_analyze.py

      - name: Test patched tree
        run: flutter test
