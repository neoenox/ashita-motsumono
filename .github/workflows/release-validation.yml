name: Flutter Release Validation

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ADMOB_APP_ID: ca-app-pub-3940256099942544~3347511713
      CI_KEYSTORE_PASSWORD: ashita-ci-release
      CI_KEY_ALIAS: ashita-ci
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/pdf-intake
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Prepare Android release tree
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          bash tool/create_platforms.sh
          bash tool/configure_android_release.sh
          flutter pub get
          keytool -genkeypair \
            -keystore android/app/ci-release-keystore.jks \
            -storepass "$CI_KEYSTORE_PASSWORD" \
            -keypass "$CI_KEYSTORE_PASSWORD" \
            -alias "$CI_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=Ashita Motsumono CI, OU=CI, O=Apunoki, L=Kumagaya, ST=Saitama, C=JP"
          cat > android/key.properties <<EOF
          storeFile=app/ci-release-keystore.jks
          storePassword=$CI_KEYSTORE_PASSWORD
          keyAlias=$CI_KEY_ALIAS
          keyPassword=$CI_KEYSTORE_PASSWORD
          EOF

      - name: Capture verbose release APK build
        id: apk
        shell: bash
        continue-on-error: true
        run: |
          set +e
          mkdir -p build/release-diagnostics
          flutter build apk --release --verbose \
            --dart-define=ADMOB_BANNER_AD_UNIT_ID=ca-app-pub-3940256099942544/6300978111 \
            --dart-define=IAP_REMOVE_ADS_PRODUCT_ID=ci.remove_ads \
            --dart-define=IAP_AI_ACCESS_PRODUCT_ID=ci.ai_analysis \
            --dart-define=GEMINI_PROXY_URL=https://example.invalid \
            > build/release-diagnostics/flutter-build-apk.log 2>&1
          code=$?
          printf '%s\n' "$code" > build/release-diagnostics/flutter-build-apk.exit-code
          exit "$code"

      - name: Restore validation workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master --depth=1
          git checkout origin/master -- .github/workflows/release-validation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/release-validation.yml
          git commit -m 'ci: restore release validation workflow'
          git push origin HEAD:feature/pdf-intake

      - name: Upload release build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locked-release-build-${{ github.sha }}
          path: build/release-diagnostics/
          if-no-files-found: error
          retention-days: 1

      - name: Enforce release APK result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f build/release-diagnostics/flutter-build-apk.exit-code
          test "$(cat build/release-diagnostics/flutter-build-apk.exit-code)" = '0'
