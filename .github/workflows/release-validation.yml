name: Flutter Release Validation

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/pdf-intake
          fetch-depth: 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format intake changes and update branch
        shell: bash
        run: |
          set -euo pipefail
          dart format .

          git fetch origin master --depth=1
          git checkout origin/master -- .github/workflows/release-validation.yml
          rm -f .github/workflows/tmp-intake-validation.yml

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- '*.dart'
          git add -u .github/workflows
          if git diff --cached --quiet; then
            echo 'No formatting or workflow cleanup changes were required.'
          else
            git commit -m 'style: format PDF intake changes'
            git push origin HEAD:feature/pdf-intake
          fi

      - name: Analyze formatted tree
        shell: bash
        continue-on-error: true
        run: |
          set +e
          mkdir -p build/intake-validation
          python3 tool/run_flutter_analyze.py > build/intake-validation/flutter-analyze.log 2>&1
          echo "$?" > build/intake-validation/flutter-analyze.exit-code

      - name: Test formatted tree
        shell: bash
        continue-on-error: true
        run: |
          set +e
          mkdir -p build/intake-validation
          flutter test > build/intake-validation/flutter-test.log 2>&1
          echo "$?" > build/intake-validation/flutter-test.exit-code

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intake-validation-${{ github.sha }}
          path: build/intake-validation/
          if-no-files-found: warn
          retention-days: 1

      - name: Enforce validation result
        shell: bash
        run: |
          set -euo pipefail
          analyze_code="$(cat build/intake-validation/flutter-analyze.exit-code)"
          test_code="$(cat build/intake-validation/flutter-test.exit-code)"
          if [[ "$analyze_code" != '0' || "$test_code" != '0' ]]; then
            echo "Validation failed: analyze=$analyze_code test=$test_code"
            exit 1
          fi
