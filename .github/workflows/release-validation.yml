name: Flutter Release Validation

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/pdf-intake
          fetch-depth: 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply cancellation hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, *, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrences, found {actual}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          replace(
              'lib/src/screens/add_todo_screen_actions.dart',
              '''        IntakeProgress(
                  stage: IntakeProgressStage.recognizingImages,
                  current: 0,
                  total: picked.length,
                ),''',
              '''        IntakeProgress(
                  stage: IntakeProgressStage.recognizingImages,
                  current: 1,
                  total: picked.length,
                ),''',
          )
          replace(
              'lib/src/screens/add_todo_screen_actions.dart',
              '''  void _cancelIntake() {
                final token = _cancellationToken;
                if (token == null || token.isCancelled) return;
                token.cancel();
                _update(() => _cancelRequested = true);
              }''',
              '''  void _cancelIntake() {
                final token = _cancellationToken;
                if (token == null || token.isCancelled) return;
                if (_intakeProgress?.stage == IntakeProgressStage.saving) return;
                token.cancel();
                _update(() => _cancelRequested = true);
              }''',
          )

          replace(
              'lib/src/widgets/intake_progress_overlay.dart',
              '''    final cs = Theme.of(context).colorScheme;
                final message = cancelling ? 'キャンセルしています...' : progress.message;

                return Material(''',
              '''    final cs = Theme.of(context).colorScheme;
                final isSaving = progress.stage == IntakeProgressStage.saving;
                final message = cancelling ? 'キャンセルしています...' : progress.message;

                return Material(''',
          )
          replace(
              'lib/src/widgets/intake_progress_overlay.dart',
              '''                      Text(
                                '処理中はこの画面を閉じないでください。',
                                textAlign: TextAlign.center,
                                style: TextStyle(
                                  color: cs.onSurfaceVariant,
                                  fontSize: 12,
                                ),
                              ),''',
              '''                      Text(
                                isSaving
                                    ? '保存中はキャンセルできません。'
                                    : '処理中はこの画面を閉じないでください。',
                                textAlign: TextAlign.center,
                                style: TextStyle(
                                  color: cs.onSurfaceVariant,
                                  fontSize: 12,
                                ),
                              ),''',
          )
          replace(
              'lib/src/widgets/intake_progress_overlay.dart',
              '''                      OutlinedButton.icon(
                                onPressed: cancelling ? null : onCancel,
                                icon: const Icon(Icons.close),
                                label: Text(cancelling ? 'キャンセル中' : 'キャンセル'),
                              ),''',
              '''                      OutlinedButton.icon(
                                onPressed: cancelling || isSaving ? null : onCancel,
                                icon: const Icon(Icons.close),
                                label: Text(
                                  cancelling
                                      ? 'キャンセル中'
                                      : isSaving
                                      ? '保存中'
                                      : 'キャンセル',
                                ),
                              ),''',
          )

          replace(
              'lib/src/services/document_intake_service.dart',
              '''        onProgress?.call(
                  const IntakeProgress(
                    stage: IntakeProgressStage.saving,
                    current: 1,
                    total: 1,
                  ),
                );
                final document = await _saveDocumentWithPages(
                  sourceType: sourceType,
                  sourceMimeType: 'application/pdf',
                  sourceFingerprint: fileHash,
                  ocrText: combinedText,
                  pageResults: pageResults,
                );''',
              '''        onProgress?.call(
                  const IntakeProgress(
                    stage: IntakeProgressStage.saving,
                    current: 1,
                    total: 1,
                  ),
                );
                cancellationToken?.throwIfCancelled();
                final document = await _saveDocumentWithPages(
                  sourceType: sourceType,
                  sourceMimeType: 'application/pdf',
                  sourceFingerprint: fileHash,
                  ocrText: combinedText,
                  pageResults: pageResults,
                  cancellationToken: cancellationToken,
                );''',
          )
          replace(
              'lib/src/services/document_intake_service.dart',
              '''        onProgress?.call(
                  const IntakeProgress(
                    stage: IntakeProgressStage.saving,
                    current: 1,
                    total: 1,
                  ),
                );
                final document = await _saveDocumentWithPages(
                  sourceType: sourceType,
                  sourceMimeType: 'image/*',
                  ocrText: combinedText,
                  pageResults: pageResults,
                );''',
              '''        onProgress?.call(
                  const IntakeProgress(
                    stage: IntakeProgressStage.saving,
                    current: 1,
                    total: 1,
                  ),
                );
                cancellationToken?.throwIfCancelled();
                final document = await _saveDocumentWithPages(
                  sourceType: sourceType,
                  sourceMimeType: 'image/*',
                  ocrText: combinedText,
                  pageResults: pageResults,
                  cancellationToken: cancellationToken,
                );''',
          )
          replace(
              'lib/src/services/document_intake_service.dart',
              '''    String? sourceMimeType,
                String? sourceFingerprint,
              }) async {''',
              '''    String? sourceMimeType,
                String? sourceFingerprint,
                IntakeCancellationToken? cancellationToken,
              }) async {''',
          )
          replace(
              'lib/src/services/document_intake_service.dart',
              '''    try {
                  for (final pageResult in pageResults) {
                    final extension = _supportedExtension(pageResult.imageFile.path);''',
              '''    try {
                  cancellationToken?.throwIfCancelled();
                  for (final pageResult in pageResults) {
                    cancellationToken?.throwIfCancelled();
                    final extension = _supportedExtension(pageResult.imageFile.path);''',
          )
          replace(
              'lib/src/services/document_intake_service.dart',
              '''      await _appState.addDocumentRecord(document);
                  return document;''',
              '''      cancellationToken?.throwIfCancelled();
                  await _appState.addDocumentRecord(document);
                  if (cancellationToken?.isCancelled ?? false) {
                    await _appState.deleteDocument(document.id);
                    throw const IntakeCancelledException();
                  }
                  return document;''',
          )

          test_path = Path('test/document_intake_service_test.dart')
          test_text = test_path.read_text(encoding='utf-8')
          anchor = "  test('removes copied images when database persistence fails', () async {"
          if test_text.count(anchor) != 1:
              raise SystemExit('document intake test insertion anchor not found exactly once')
          new_test = '''  test('rolls back when cancellation is requested before saving', () async {
                final tempDir = await Directory.systemTemp.createTemp(
                  'document_intake_cancel_saving_',
                );
                final (state, settings) = await _createState();
                addTearDown(() async {
                  await state.close();
                  state.dispose();
                  if (await tempDir.exists()) {
                    await tempDir.delete(recursive: true);
                  }
                });

                final source = File('${tempDir.path}/source.jpg')
                  ..writeAsBytesSync([1, 2, 3]);
                final token = IntakeCancellationToken();
                final service = DocumentIntakeService(
                  appState: state,
                  appSettings: settings,
                  ocrService: _QueueOcrService(['持ち物 水筒']),
                  temporaryDirectoryProvider: () async => tempDir,
                  documentsDirectoryProvider: () async => tempDir,
                );

                final result = await service.importImages(
                  sourcePaths: [source.path],
                  sourceType: 'gallery',
                  cancellationToken: token,
                  onProgress: (entry) {
                    if (entry.stage == IntakeProgressStage.saving) {
                      token.cancel();
                    }
                  },
                );

                expect(result, isA<IntakeError>());
                expect(
                  (result as IntakeError).message,
                  DocumentIntakeService.cancelledMessage,
                );
                expect(state.documents, isEmpty);
                final imagesDir = Directory('${tempDir.path}/document_images');
                final remaining = await imagesDir.exists()
                    ? await imagesDir.list().toList()
                    : const <FileSystemEntity>[];
                expect(remaining, isEmpty);
              });

          '''
          test_path.write_text(test_text.replace(anchor, new_test + anchor), encoding='utf-8')
          PY

          dart format \
            lib/src/screens/add_todo_screen_actions.dart \
            lib/src/widgets/intake_progress_overlay.dart \
            lib/src/services/document_intake_service.dart \
            test/document_intake_service_test.dart

          git fetch origin master --depth=1
          git checkout origin/master -- .github/workflows/release-validation.yml

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            lib/src/screens/add_todo_screen_actions.dart \
            lib/src/widgets/intake_progress_overlay.dart \
            lib/src/services/document_intake_service.dart \
            test/document_intake_service_test.dart \
            .github/workflows/release-validation.yml
          git commit -m 'fix: make intake cancellation rollback-safe'
          git push origin HEAD:feature/pdf-intake

      - name: Analyze patched tree
        shell: bash
        run: python3 tool/run_flutter_analyze.py

      - name: Test patched tree
        run: flutter test
