name: Repair PR 133 widget test pumping

on:
  push:
    branches:
      - fix/v0.6.3-release-gate
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-pr-133-widget-test-pumping
  cancel-in-progress: true

jobs:
  repair-widget-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: fix/v0.6.3-release-gate
          fetch-depth: 0

      - name: Replace unbounded settle waits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('test/widget_test.dart')
          text = path.read_text(encoding='utf-8')
          settings_helper = """Future<AppSettings> _createSettings() async {
            final prefs = await SharedPreferences.getInstance();
            return AppSettings(prefs);
          }
          """
          pump_helper = """
          /// Advances enough deterministic frames for route and implicit animations.
          ///
          /// The app can keep scheduling frames while the HomeScreen is visible, so
          /// pumpAndSettle is not a valid completion condition for these UI tests.
          Future<void> _pumpUi(WidgetTester tester) async {
            for (var frame = 0; frame < 10; frame++) {
              await tester.pump(const Duration(milliseconds: 100));
            }
          }
          """

          if '_pumpUi(WidgetTester tester)' not in text:
              if settings_helper not in text:
                  raise SystemExit('AppSettings helper anchor was not found')
              text = text.replace(settings_helper, settings_helper + pump_helper, 1)

          replaced = text.count('await tester.pumpAndSettle();')
          text = text.replace(
              'await tester.pumpAndSettle();',
              'await _pumpUi(tester);',
          )
          path.write_text(text, encoding='utf-8')
          print(f'replaced {replaced} pumpAndSettle calls')
          PY

          if git diff --quiet -- test/widget_test.dart; then
            echo 'Widget test pumping is already bounded.'
            exit 0
          fi

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/widget_test.dart
          git commit -m 'test: bound widget test frame pumping'
          git push origin HEAD:fix/v0.6.3-release-gate
