name: Repair PR 133 widget test pumping

on:
  push:
    branches:
      - fix/v0.6.3-release-gate
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-pr-133-widget-test-pumping
  cancel-in-progress: true

jobs:
  repair-widget-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: fix/v0.6.3-release-gate
          fetch-depth: 0

      - name: Replace unbounded settle waits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('test/widget_test.dart')
          text = path.read_text(encoding='utf-8')
          settings_helper = (
              "Future<AppSettings> _createSettings() async {\n"
              "  final prefs = await SharedPreferences.getInstance();\n"
              "  return AppSettings(prefs);\n"
              "}\n"
          )
          pump_helper = (
              "\n/// Advances enough deterministic frames for route and implicit animations.\n"
              "///\n"
              "/// HomeScreen can keep scheduling frames while it is visible, so\n"
              "/// pumpAndSettle is not a valid completion condition for these tests.\n"
              "Future<void> _pumpUi(WidgetTester tester) async {\n"
              "  for (var frame = 0; frame < 10; frame++) {\n"
              "    await tester.pump(const Duration(milliseconds: 100));\n"
              "  }\n"
              "}\n"
          )

          helper_added = False
          if '_pumpUi(WidgetTester tester)' not in text:
              if settings_helper not in text:
                  raise SystemExit('AppSettings helper anchor was not found')
              text = text.replace(settings_helper, settings_helper + pump_helper, 1)
              helper_added = True

          replaced = text.count('await tester.pumpAndSettle();')
          text = text.replace(
              'await tester.pumpAndSettle();',
              'await _pumpUi(tester);',
          )
          if not helper_added and replaced == 0:
              print('Widget test pumping is already bounded.')
          else:
              path.write_text(text, encoding='utf-8')
              print(f'added helper: {helper_added}; replaced calls: {replaced}')
          PY

          if git diff --quiet -- test/widget_test.dart; then
            echo 'Widget test pumping is already bounded.'
            exit 0
          fi

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/widget_test.dart
          git commit -m 'test: bound widget test frame pumping'
          git push origin HEAD:fix/v0.6.3-release-gate
