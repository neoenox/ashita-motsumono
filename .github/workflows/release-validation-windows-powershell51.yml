name: Release Validation Windows PowerShell 5.1

on:
  pull_request:
    paths:
      - '.github/workflows/release-validation-windows-powershell51.yml'

permissions:
  contents: write

jobs:
  apply-literal-evidence-access:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/release-validation-hardening
          fetch-depth: 1

      - name: Harden case evidence path access
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          cases_path = Path('tool/issue60_emulator_evidence_cases.ps1')
          text = cases_path.read_text(encoding='utf-8')

          text, test_path_count = re.subn(
              r'Test-Path (?!-LiteralPath\b)',
              'Test-Path -LiteralPath ',
              text,
          )
          if test_path_count != 9:
              raise SystemExit(f'expected 9 non-Literal Test-Path calls, found {test_path_count}')

          text, get_content_count = re.subn(
              r'Get-Content -Raw -Encoding utf8 (?!-LiteralPath\b)',
              'Get-Content -Raw -Encoding utf8 -LiteralPath ',
              text,
          )
          if get_content_count != 8:
              raise SystemExit(f'expected 8 single-line Get-Content calls, found {get_content_count}')

          old_reboot = """      $reboot = Get-Content `
        -Raw `
        -Encoding utf8 `
        (Join-Path $CaseDirectory 'reboot-result.json') |"""
          new_reboot = """      $reboot = Get-Content `
        -Raw `
        -Encoding utf8 `
        -LiteralPath (Join-Path $CaseDirectory 'reboot-result.json') |"""
          if text.count(old_reboot) != 1:
              raise SystemExit(f'expected one multiline reboot read, found {text.count(old_reboot)}')
          text = text.replace(old_reboot, new_reboot, 1)

          child_item_old = """Get-ChildItem `
    $CaseDirectory `"""
          child_item_new = """Get-ChildItem `
    -LiteralPath $CaseDirectory `"""
          if text.count(child_item_old) != 2:
              raise SystemExit(f'expected two Get-ChildItem paths, found {text.count(child_item_old)}')
          text = text.replace(child_item_old, child_item_new)

          get_item_count = text.count('Get-Item (Join-Path')
          if get_item_count != 2:
              raise SystemExit(f'expected two Get-Item path reads, found {get_item_count}')
          text = text.replace('Get-Item (Join-Path', 'Get-Item -LiteralPath (Join-Path')

          if re.search(r'Test-Path\s+(?!-LiteralPath\b)', text):
              raise SystemExit('non-Literal Test-Path remains in case evidence script')
          if re.search(r'Get-Content -Raw -Encoding utf8 (?!-LiteralPath\b)', text):
              raise SystemExit('non-Literal single-line Get-Content remains')
          if 'Get-Item (Join-Path' in text:
              raise SystemExit('non-Literal Get-Item remains')
          if child_item_old in text:
              raise SystemExit('non-Literal Get-ChildItem remains')

          cases_path.write_text(text, encoding='utf-8', newline='\n')

          contract_path = Path('test/issue60_emulator_evidence_contract_test.dart')
          contract = contract_path.read_text(encoding='utf-8')
          marker = "  test('session driver has one evidence root and strict order', () {"
          addition = r"""  test('case evidence file paths are treated literally', () {
    final text = cases.readAsStringSync();

    expect(
      RegExp(r'Test-Path\s+(?!-LiteralPath\b)').hasMatch(text),
      isFalse,
    );
    expect(
      RegExp(
        r'Get-Content -Raw -Encoding utf8 (?!-LiteralPath\b)',
      ).hasMatch(text),
      isFalse,
    );
    expect(text, isNot(contains('Get-Item (Join-Path')));
    expect(
      text,
      isNot(contains('Get-ChildItem `\n    $CaseDirectory `')),
    );
  });

"""
          if contract.count(marker) != 1:
              raise SystemExit(f'expected one contract insertion marker, found {contract.count(marker)}')
          contract_path.write_text(
              contract.replace(marker, addition + marker, 1),
              encoding='utf-8',
              newline='\n',
          )
          PY

      - name: Commit hardening to PR branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tool/issue60_emulator_evidence_cases.ps1 \
            test/issue60_emulator_evidence_contract_test.dart
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix: treat case evidence paths literally'
          git push origin HEAD:agent/release-validation-hardening
