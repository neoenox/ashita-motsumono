name: Release Validation Windows PowerShell 5.1

on:
  pull_request:
    paths:
      - '.github/workflows/release-validation-windows-powershell51.yml'

permissions:
  contents: write

jobs:
  apply-literal-path-hardening:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/release-validation-hardening
          fetch-depth: 1

      - name: Eliminate remaining wildcard path interpretation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          control_path = Path('tool/release_validation_control.ps1')
          control = control_path.read_text(encoding='utf-8')
          control, count = re.subn(
              r'Test-Path (?!-LiteralPath\b)',
              'Test-Path -LiteralPath ',
              control,
          )
          if count != 8:
              raise SystemExit(f'expected 8 remaining non-Literal Test-Path calls, found {count}')
          if re.search(r'Test-Path\s+(?!-LiteralPath\b)', control):
              raise SystemExit('non-Literal Test-Path call remains')
          control_path.write_text(control, encoding='utf-8', newline='\n')

          test_path = Path('test/release_validation_hardening_contract_test.dart')
          test = test_path.read_text(encoding='utf-8')
          old = "    expect(text, contains('Test-Path -LiteralPath'));\n    for (final token in <String>["
          new = "    expect(text, contains('Test-Path -LiteralPath'));\n    expect(\n      RegExp(r'Test-Path\\s+(?!-LiteralPath\\b)').hasMatch(text),\n      isFalse,\n    );\n    for (final token in <String>["
          if test.count(old) != 1:
              raise SystemExit(f'expected one contract insertion point, found {test.count(old)}')
          test_path.write_text(test.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY

      - name: Commit hardening to PR branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tool/release_validation_control.ps1 \
            test/release_validation_hardening_contract_test.dart
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix: make all validation path checks literal'
          git push origin HEAD:agent/release-validation-hardening
