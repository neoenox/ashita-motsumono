name: Agent Dart Diagnostics

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Capture formatter changes
        run: |
          dart format .
          git diff --name-only > formatted-files.txt
          git diff --binary > format.patch
          cat formatted-files.txt

      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos > analyze.log 2>&1
          status=$?
          cat analyze.log
          echo "$status" > analyze.exit
          exit 0

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: agent-dart-diagnostics
          path: |
            formatted-files.txt
            format.patch
            analyze.log
            analyze.exit
          if-no-files-found: error
