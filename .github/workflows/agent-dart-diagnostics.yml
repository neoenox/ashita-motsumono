name: Agent Dart Diagnostics

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: |
          dart format \
            lib/src/screens/add_todo_screen_actions.dart \
            lib/src/services/ocr_pick_service.dart \
            test/ocr_pick_service_intake_result_test.dart

      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos > analyze.log 2>&1
          status=$?
          cat analyze.log
          echo "$status" > analyze.exit
          exit 0

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: agent-dart-diagnostics
          path: |
            lib/src/screens/add_todo_screen_actions.dart
            lib/src/services/ocr_pick_service.dart
            test/ocr_pick_service_intake_result_test.dart
            analyze.log
            analyze.exit
          if-no-files-found: error
