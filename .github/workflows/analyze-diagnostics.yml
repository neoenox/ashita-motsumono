name: Flutter Analyze Diagnostics

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: python3 tool/run_flutter_analyze.py

      - name: Upload analyze diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-diagnostics
          path: build/diagnostics/flutter-analyze.txt
          if-no-files-found: error
          retention-days: 1
