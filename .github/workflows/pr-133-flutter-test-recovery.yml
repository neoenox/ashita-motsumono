# Temporary repair and bounded validation for PR #133. Remove after CI passes.
name: Recover PR 133 Flutter tests

on:
  push:
    branches:
      - fix/v0.6.3-release-gate
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: recover-pr-133-flutter-tests
  cancel-in-progress: true

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Publish repair start status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -n \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:"pending", target_url:$target_url, description:"Repairing widget test temp IO", context:"pr-133-flutter-test-recovery"}' \
            > status.json
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --input status.json

      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: fix/v0.6.3-release-gate
          fetch-depth: 0

      - name: Replace async temp directory IO
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('test/widget_test.dart')
          text = path.read_text(encoding='utf-8')
          old = """  final tempDir = await Directory.systemTemp.createTemp('ashita_widget_test_');
          addTearDown(() async {
            if (await tempDir.exists()) {
              await tempDir.delete(recursive: true);
            }
          });
          """
          new = """  // Widget tests run in a fake-async zone, so real temporary-directory IO
          // must be synchronous or the setup Future can remain pending indefinitely.
          final tempDir = Directory.systemTemp.createTempSync('ashita_widget_test_');
          addTearDown(() {
            if (tempDir.existsSync()) {
              tempDir.deleteSync(recursive: true);
            }
          });
          """
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
              print('Replaced async temporary-directory setup.')
          elif 'createTempSync' in text:
              print('Synchronous temporary-directory setup is already present.')
          else:
              raise SystemExit('Temporary-directory setup anchor was not found')
          PY

          if git diff --quiet -- test/widget_test.dart; then
            echo 'No widget test repair commit is needed.'
            exit 0
          fi

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/widget_test.dart
          git commit -m 'test: avoid async temp IO in widget setup'
          git pull --rebase origin fix/v0.6.3-release-gate
          git push origin HEAD:fix/v0.6.3-release-gate

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run repaired widget tests
        id: flutter-tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          mkdir -p build/ci-diagnostics

          timeout --signal=INT --kill-after=30s 2m \
            flutter test test/widget_test.dart \
              --plain-name 'HomeScreen shows empty state when children exist but no todos' \
              --concurrency=1 --reporter expanded \
            2>&1 | tee build/ci-diagnostics/home-empty-state-repaired.log
          isolated_status=${PIPESTATUS[0]}

          timeout --signal=INT --kill-after=30s 5m \
            flutter test test/widget_test.dart --concurrency=1 --reporter expanded \
            2>&1 | tee build/ci-diagnostics/widget-test-expanded.log
          suite_status=${PIPESTATUS[0]}

          printf 'isolated_status=%s\nsuite_status=%s\n' \
            "$isolated_status" "$suite_status" \
            | tee build/ci-diagnostics/statuses.txt

          if (( isolated_status != 0 || suite_status != 0 )); then
            exit 1
          fi

      - name: Upload Flutter test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-133-flutter-test-diagnostics-${{ github.sha }}
          path: build/ci-diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Publish repair result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_OUTCOME: ${{ steps.flutter-tests.outcome }}
        run: |
          set -euo pipefail
          state=failure
          description='PR 133 widget repair failed or timed out'
          if [[ "$TEST_OUTCOME" == 'success' ]]; then
            state=success
            description='PR 133 repaired widget tests passed'
          fi
          jq -n \
            --arg state "$state" \
            --arg description "$description" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state, target_url:$target_url, description:$description, context:"pr-133-flutter-test-recovery"}' \
            > status.json
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --input status.json
          [[ "$TEST_OUTCOME" == 'success' ]]
