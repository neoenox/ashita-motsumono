# Temporary bounded diagnostic for PR #133. Remove after normal CI passes.
name: Recover PR 133 Flutter tests

on:
  push:
    branches:
      - fix/v0.6.3-release-gate
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: recover-pr-133-flutter-tests
  cancel-in-progress: true

jobs:
  diagnose-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Publish diagnostic start status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -n \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:"pending", target_url:$target_url, description:"Isolating PR 133 widget test hang", context:"pr-133-flutter-test-recovery"}' \
            > status.json
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --input status.json

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Isolate widget test hang
        id: flutter-tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/ci-diagnostics

          echo '=== second HomeScreen test in isolation ==='
          timeout --signal=INT --kill-after=30s 2m \
            flutter test test/widget_test.dart \
              --plain-name 'HomeScreen shows empty state when children exist but no todos' \
              --concurrency=1 --reporter expanded \
            2>&1 | tee build/ci-diagnostics/home-empty-state-isolated.log
          isolated_status=${PIPESTATUS[0]}

          echo '=== first HomeScreen test in isolation ==='
          timeout --signal=INT --kill-after=30s 2m \
            flutter test test/widget_test.dart \
              --plain-name 'HomeScreen shows home screen and first run card' \
              --concurrency=1 --reporter expanded \
            2>&1 | tee build/ci-diagnostics/home-first-run-isolated.log
          first_status=${PIPESTATUS[0]}

          echo '=== complete widget test file ==='
          timeout --signal=INT --kill-after=30s 5m \
            flutter test test/widget_test.dart --concurrency=1 --reporter expanded \
            2>&1 | tee build/ci-diagnostics/widget-test-expanded.log
          suite_status=${PIPESTATUS[0]}

          printf 'isolated_status=%s\nfirst_status=%s\nsuite_status=%s\n' \
            "$isolated_status" "$first_status" "$suite_status" \
            | tee build/ci-diagnostics/statuses.txt

          if (( isolated_status != 0 || first_status != 0 || suite_status != 0 )); then
            exit 1
          fi

      - name: Upload Flutter test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-133-flutter-test-diagnostics-${{ github.sha }}
          path: build/ci-diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Publish diagnostic result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_OUTCOME: ${{ steps.flutter-tests.outcome }}
        run: |
          set -euo pipefail
          state=failure
          description='PR 133 widget isolation failed or timed out'
          if [[ "$TEST_OUTCOME" == 'success' ]]; then
            state=success
            description='PR 133 widget isolation passed'
          fi

          jq -n \
            --arg state "$state" \
            --arg description "$description" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state, target_url:$target_url, description:$description, context:"pr-133-flutter-test-recovery"}' \
            > status.json
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --input status.json

          if [[ "$TEST_OUTCOME" != 'success' ]]; then
            exit 1
          fi
