name: Recover PR 133 Flutter tests

on:
  push:
    branches:
      - fix/v0.6.3-release-gate
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: recover-pr-133-flutter-tests
  cancel-in-progress: true

jobs:
  cancel-stale-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel superseded Flutter runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          runs_json="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=${GITHUB_REF_NAME}&status=in_progress&per_page=100"
          )"

          mapfile -t run_ids < <(
            jq -r \
              --argjson current_run_id "${GITHUB_RUN_ID}" \
              '.workflow_runs[]
               | select(
                   (.name == "Flutter CI" or .name == "Flutter Release Validation")
                   and (.id != $current_run_id)
                 )
               | .id' \
              <<<"${runs_json}"
          )

          if (( ${#run_ids[@]} == 0 )); then
            echo 'No superseded Flutter workflow runs are still in progress.'
            exit 0
          fi

          for run_id in "${run_ids[@]}"; do
            echo "Cancelling workflow run ${run_id}"
            gh api \
              --method POST \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" \
              || echo "Run ${run_id} was already completing or completed."
          done

  diagnose-tests:
    needs: cancel-stale-runs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests serially with bounded diagnostics
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/ci-diagnostics
          timeout --signal=INT --kill-after=30s 15m \
            flutter test --concurrency=1 --reporter expanded \
            2>&1 | tee build/ci-diagnostics/flutter-test-expanded.log

      - name: Upload Flutter test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-133-flutter-test-diagnostics-${{ github.sha }}
          path: build/ci-diagnostics/
          if-no-files-found: warn
          retention-days: 7
