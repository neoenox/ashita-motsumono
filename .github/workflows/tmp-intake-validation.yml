name: Temporary Intake Validation Export

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format intake changes
        shell: bash
        run: |
          set -euo pipefail
          files=(
            lib/src/screens/add_todo_screen.dart
            lib/src/screens/add_todo_screen_actions.dart
            lib/src/screens/add_todo_screen_layout.dart
            lib/src/screens/home_screen.dart
            lib/src/screens/home_screen_actions.dart
            lib/src/screens/home_screen_components.dart
            lib/src/screens/home_screen_layout.dart
            lib/src/screens/no_candidates_screen.dart
            lib/src/services/document_intake_service.dart
            lib/src/services/ocr_pick_service.dart
            lib/src/services/pdf_render_service.dart
            lib/src/services/receive_share_handler.dart
            lib/src/services/receive_share_handler_runtime.dart
            lib/src/services/receive_share_handler_sources.dart
            lib/src/services/receive_share_handler_state.dart
            lib/src/widgets/intake_progress_overlay.dart
            test/document_intake_service_test.dart
            test/intake_progress_overlay_test.dart
          )
          dart format "${files[@]}"
          mkdir -p build/intake-validation/formatted
          cp --parents "${files[@]}" build/intake-validation/formatted/

      - name: Analyze formatted tree
        shell: bash
        continue-on-error: true
        run: |
          set +e
          mkdir -p build/intake-validation
          python3 tool/run_flutter_analyze.py > build/intake-validation/flutter-analyze.log 2>&1
          echo "$?" > build/intake-validation/flutter-analyze.exit-code

      - name: Test formatted tree
        shell: bash
        continue-on-error: true
        run: |
          set +e
          mkdir -p build/intake-validation
          flutter test > build/intake-validation/flutter-test.log 2>&1
          echo "$?" > build/intake-validation/flutter-test.exit-code

      - name: Upload formatted sources and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intake-validation-${{ github.sha }}
          path: build/intake-validation/
          if-no-files-found: error
          retention-days: 1
