name: Temporary Intake Validation Export

on:
  push:
    branches: [feature/pdf-intake]

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format, validate, and persist diagnostics
        shell: bash
        run: |
          set -u
          files=(
            lib/src/screens/add_todo_screen.dart
            lib/src/screens/add_todo_screen_actions.dart
            lib/src/screens/add_todo_screen_layout.dart
            lib/src/screens/home_screen.dart
            lib/src/screens/home_screen_actions.dart
            lib/src/screens/home_screen_components.dart
            lib/src/screens/home_screen_layout.dart
            lib/src/screens/no_candidates_screen.dart
            lib/src/services/document_intake_service.dart
            lib/src/services/ocr_pick_service.dart
            lib/src/services/pdf_render_service.dart
            lib/src/services/receive_share_handler.dart
            lib/src/services/receive_share_handler_runtime.dart
            lib/src/services/receive_share_handler_sources.dart
            lib/src/services/receive_share_handler_state.dart
            lib/src/widgets/intake_progress_overlay.dart
            test/document_intake_service_test.dart
            test/intake_progress_overlay_test.dart
          )

          mkdir -p .tmp/intake-validation
          dart format "${files[@]}" > .tmp/intake-validation/dart-format.log 2>&1
          format_code=$?
          python3 tool/run_flutter_analyze.py > .tmp/intake-validation/flutter-analyze.log 2>&1
          analyze_code=$?
          flutter test > .tmp/intake-validation/flutter-test.log 2>&1
          test_code=$?
          printf '%s\n' "$format_code" > .tmp/intake-validation/dart-format.exit-code
          printf '%s\n' "$analyze_code" > .tmp/intake-validation/flutter-analyze.exit-code
          printf '%s\n' "$test_code" > .tmp/intake-validation/flutter-test.exit-code

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/tmp-intake-validation.yml
          git add "${files[@]}"
          git add -f .tmp/intake-validation
          git add .github/workflows/tmp-intake-validation.yml
          git commit -m 'chore: format intake changes and record validation'
          git push origin HEAD:feature/pdf-intake
