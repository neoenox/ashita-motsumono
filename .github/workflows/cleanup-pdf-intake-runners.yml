name: Cleanup PDF intake runners

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pdf-intake
          fetch-depth: 0
      - name: Remove diagnostic runners
        shell: bash
        run: |
          set -e
          for attempt in 1 2 3 4 5; do
            git fetch origin feature/pdf-intake
            git reset --hard origin/feature/pdf-intake
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm --ignore-unmatch \
              .github/workflows/apply-pdf-intake-p0-pr.yml \
              .github/workflows/debug-pdf-intake-apply.yml \
              .github/workflows/apply-pdf-intake-p0-fixed.yml \
              .github/workflows/debug-pdf-intake-fixed.yml \
              .github/workflows/apply-pdf-intake-p0-fixed-v2.yml \
              .github/workflows/debug-pdf-intake-v2.yml \
              .github/workflows/inspect-pdf-intake-script.yml \
              .github/workflows/apply-pdf-intake-p0-fixed-v3.yml \
              .github/workflows/debug-pdf-intake-v3.yml \
              .github/workflows/debug-pdf-intake-analyze.yml \
              .github/workflows/cleanup-pdf-intake-runners.yml \
              .github/pdf-intake-apply-debug.log \
              .github/pdf-intake-fixed-debug.log \
              .github/pdf-intake-v2-debug.log \
              .github/pdf-intake-script-inspect.log \
              .github/pdf-intake-v3-debug.log \
              .github/pdf-intake-analyze-debug.log
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "chore: remove PDF intake diagnostic runners"
            if git push origin HEAD:feature/pdf-intake; then
              exit 0
            fi
          done
          exit 1
