name: Full Source Hardening Evidence

on:
  push:
    branches:
      - agent/full-source-hardening
    paths:
      - docs/validation/validation-trigger.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/full-source-hardening
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Run validation and record evidence
        id: validation
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p build/ci-evidence
          python3 - <<'PY'
          from pathlib import Path

          Path('build/ci-evidence/commands.txt').write_text(
              '\n'.join([
                  'python3 tool/apply_final_test_harness_fixes.py',
                  'flutter pub get',
                  'python3 tool/sync_app_version.py',
                  'python3 tool/verify_android_manifest.py',
                  'python3 -m unittest tool/test_enforce_android_release_signing.py',
                  'python3 -m unittest tool/test_verify_android_certificate_fingerprint.py',
                  'python3 -m unittest tool/test_generate_release_manifest.py',
                  'python3 -m unittest tool/test_release_workflow.py',
                  'flutter analyze --no-fatal-infos',
                  'flutter test --reporter json',
                  'flutter test tool/generate_lp_screenshots_test.dart --reporter json',
              ]) + '\n',
              encoding='utf-8',
          )
          PY

          : > build/ci-evidence/results.tsv
          index=0
          while IFS= read -r command; do
            index=$((index + 1))
            log="build/ci-evidence/command-${index}.log"
            echo "::group::${command}"
            set +e
            bash -lc "$command" >"$log" 2>&1
            status=$?
            set -e
            cat "$log"
            echo "::endgroup::"
            printf '%s\t%s\t%s\n' "$status" "$command" "$log" >> build/ci-evidence/results.tsv
          done < build/ci-evidence/commands.txt

          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          def clipped(value: object, limit: int = 1600) -> str:
              text = str(value or '')
              return text if len(text) <= limit else text[:limit] + '…'

          def json_test_failures(lines: list[str]) -> list[dict[str, object]]:
              tests: dict[int, dict[str, object]] = {}
              errors: dict[int, list[dict[str, object]]] = {}
              prints: dict[int, list[str]] = {}
              failed_ids: set[int] = set()
              for line in lines:
                  try:
                      event = json.loads(line)
                  except (json.JSONDecodeError, TypeError):
                      continue
                  event_type = event.get('type')
                  if event_type == 'testStart':
                      test = event.get('test') or {}
                      test_id = test.get('id')
                      if isinstance(test_id, int):
                          tests[test_id] = {
                              'name': test.get('name'),
                              'url': test.get('url'),
                              'line': test.get('line'),
                          }
                  elif event_type == 'error':
                      test_id = event.get('testID')
                      if isinstance(test_id, int):
                          failed_ids.add(test_id)
                          errors.setdefault(test_id, []).append({
                              'error': clipped(event.get('error')),
                              'stackTrace': clipped(
                                  '\n'.join(
                                      str(event.get('stackTrace') or '').splitlines()[:25]
                                  )
                              ),
                              'isFailure': event.get('isFailure'),
                          })
                  elif event_type == 'print':
                      test_id = event.get('testID')
                      if isinstance(test_id, int):
                          message = clipped(event.get('message'), 3000)
                          prints.setdefault(test_id, []).append(message)
                  elif event_type == 'testDone' and event.get('result') != 'success':
                      test_id = event.get('testID')
                      if isinstance(test_id, int) and not event.get('skipped', False):
                          failed_ids.add(test_id)

              failures = []
              for test_id in sorted(failed_ids):
                  metadata = tests.get(test_id, {})
                  failures.append({
                      'testID': test_id,
                      **metadata,
                      'errors': errors.get(test_id, []),
                      'printOutput': prints.get(test_id, [])[-20:],
                  })
              return failures

          rows = []
          overall = True
          for raw in Path('build/ci-evidence/results.tsv').read_text(encoding='utf-8').splitlines():
              status_raw, command, log_path = raw.split('\t', 2)
              status = int(status_raw)
              overall = overall and status == 0
              output = Path(log_path).read_text(encoding='utf-8', errors='replace').splitlines()
              failures = (
                  json_test_failures(output)
                  if status != 0 and '--reporter json' in command
                  else []
              )
              rows.append({
                  'command': command,
                  'exitCode': status,
                  'failures': failures,
                  'tail': output[-80:] if status != 0 and not failures else [],
              })

          evidence = {
              'validatedCommit': os.environ['GITHUB_SHA'],
              'workflowRunId': os.environ['GITHUB_RUN_ID'],
              'flutterVersion': '3.44.0',
              'overall': 'PASS' if overall else 'FAIL',
              'commands': rows,
          }
          output_path = Path('docs/validation/ci-evidence.json')
          output_path.parent.mkdir(parents=True, exist_ok=True)
          output_path.write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Commit validation evidence and harness fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            docs/validation/ci-evidence.json \
            test/widget_test.dart \
            tool/generate_lp_screenshots_test.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: record hardening validation evidence [skip ci]"
          git push origin HEAD:agent/full-source-hardening
