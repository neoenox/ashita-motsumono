name: Apply PR 109 Review Fixes

on:
  push:
    branches:
      - agent/release-validation-session
    paths:
      - '.github/workflows/apply-pr109-review-fixes.yml'

permissions:
  contents: write

jobs:
  apply-review-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted review fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{path}: expected one replacement, found {count}'
                  )
              file.write_text(text.replace(old, new), encoding='utf-8')

          session = 'tool/release_validation_session.ps1'
          replace_once(
              session,
              """function Write-JsonFile {
            param(
              [Parameter(Mandatory)]$Value,
              [Parameter(Mandatory)][string]$Path
            )
            $Value |
              ConvertTo-Json -Depth 16 |
              Out-File -FilePath $Path -Encoding utf8
          }

          function Read-JsonFile {
            param([Parameter(Mandatory)][string]$Path)
            if (-not (Test-Path $Path)) {
              throw \"missing file: $Path\"
            }
            Get-Content -Raw $Path | ConvertFrom-Json
          }
          """,
              """function Get-FullPath {
            param([Parameter(Mandatory)][string]$Path)
            if ([IO.Path]::IsPathRooted($Path)) {
              return [IO.Path]::GetFullPath($Path)
            }
            [IO.Path]::GetFullPath((Join-Path (Get-Location).Path $Path))
          }

          function New-Utf8NoBomEncoding {
            [Text.UTF8Encoding]::new($false, $true)
          }

          function Write-JsonFile {
            param(
              [Parameter(Mandatory)]$Value,
              [Parameter(Mandatory)][string]$Path
            )
            $fullPath = Get-FullPath $Path
            $directory = [IO.Path]::GetDirectoryName($fullPath)
            if ($directory) {
              [IO.Directory]::CreateDirectory($directory) | Out-Null
            }
            $json = ($Value | ConvertTo-Json -Depth 16) +
              [Environment]::NewLine
            [IO.File]::WriteAllText(
              $fullPath,
              $json,
              (New-Utf8NoBomEncoding)
            )
          }

          function Read-JsonFile {
            param([Parameter(Mandatory)][string]$Path)
            $fullPath = Get-FullPath $Path
            if (-not (Test-Path $fullPath)) {
              throw \"missing file: $fullPath\"
            }
            [IO.File]::ReadAllText(
              $fullPath,
              (New-Utf8NoBomEncoding)
            ) | ConvertFrom-Json
          }
          """,
          )
          replace_once(
              session,
              """function Get-GitValue {
            param([Parameter(Mandatory)][string[]]$Arguments)
            Push-Location $RepoRoot
          """,
              """function Get-GitValue {
            param([Parameter(Mandatory)][string[]]$Arguments)
            if (-not (Get-Command git -ErrorAction SilentlyContinue)) {
              return ''
            }
            Push-Location $RepoRoot
          """,
          )
          replace_once(
              session,
              """  $expected = if ($ExpectedTime) {
              $parsed = [DateTimeOffset]::Parse(
                $ExpectedTime,
                [Globalization.CultureInfo]::InvariantCulture,
                [Globalization.DateTimeStyles]::RoundtripKind
              )
              Round-UpToMinute $parsed
            }
          """,
              """  $expected = if ($ExpectedTime) {
              $parsed = [DateTimeOffset]::MinValue
              if (-not [DateTimeOffset]::TryParse(
                  $ExpectedTime,
                  [Globalization.CultureInfo]::InvariantCulture,
                  [Globalization.DateTimeStyles]::RoundtripKind,
                  [ref]$parsed
                )) {
                throw 'ExpectedTime must be ISO 8601'
              }
              Round-UpToMinute $parsed
            }
          """,
          )

          core = 'tool/issue60_emulator_evidence_core.ps1'
          replace_once(
              core,
              """function Json($Value, $Path) {
            $Value | ConvertTo-Json -Depth 12 | Out-File $Path -Encoding utf8
          }
          """,
              """function Json($Value, $Path) {
            $fullPath = if ([IO.Path]::IsPathRooted($Path)) {
              [IO.Path]::GetFullPath($Path)
            }
            else {
              [IO.Path]::GetFullPath((Join-Path (Get-Location).Path $Path))
            }
            $directory = [IO.Path]::GetDirectoryName($fullPath)
            if ($directory) {
              [IO.Directory]::CreateDirectory($directory) | Out-Null
            }
            $json = ($Value | ConvertTo-Json -Depth 12) +
              [Environment]::NewLine
            [IO.File]::WriteAllText(
              $fullPath,
              $json,
              [Text.UTF8Encoding]::new($false, $true)
            )
          }
          """,
          )

          cases = Path('tool/issue60_emulator_evidence_cases.ps1')
          cases_text = cases.read_text(encoding='utf-8')
          if 'Get-Content -Raw -Encoding utf8' in cases_text:
              raise SystemExit('cases JSON reads already use explicit UTF-8')
          count = cases_text.count('Get-Content -Raw ')
          if count < 6:
              raise SystemExit(
                  f'expected at least six JSON reads, found {count}'
              )
          cases.write_text(
              cases_text.replace(
                  'Get-Content -Raw ',
                  'Get-Content -Raw -Encoding utf8 ',
              ),
              encoding='utf-8',
          )

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'openai-release-agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tool/release_validation_session.ps1 \
            tool/issue60_emulator_evidence_core.ps1 \
            tool/issue60_emulator_evidence_cases.ps1
          git diff --cached --check
          git commit -m 'fix: harden PowerShell 5.1 JSON handling'
          git push origin HEAD:agent/release-validation-session
