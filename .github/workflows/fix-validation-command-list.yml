name: Fix Validation Command List

on:
  push:
    branches:
      - agent/full-source-hardening
    paths:
      - .github/workflows/fix-validation-command-list.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/full-source-hardening
          fetch-depth: 0

      - name: Preserve final validation command
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci-evidence.yml')
          text = path.read_text(encoding='utf-8')
          old = "              ]),\n              encoding='utf-8',\n          )"
          new = "              ]) + '\\n',\n              encoding='utf-8',\n          )"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one command-list match, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          rm .github/workflows/fix-validation-command-list.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/ci-evidence.yml .github/workflows/fix-validation-command-list.yml
          git commit -m "ci: execute the final validation command"
          git push origin HEAD:agent/full-source-hardening
