name: Apply Widget Cleaner Isolation

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/agent/full-source-hardening'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/full-source-hardening
          fetch-depth: 0

      - name: Apply test harness patch
        run: python3 tool/apply_final_test_harness_fixes.py

      - name: Commit test harness patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-widget-cleaner-isolation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test/widget_test.dart tool/generate_lp_screenshots_test.dart .github/workflows/apply-widget-cleaner-isolation.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: isolate widget cleanup from platform plugins"
          git push origin HEAD:agent/full-source-hardening
