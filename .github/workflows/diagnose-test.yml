name: Diagnose Flutter test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Capture test output
        id: test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter test --no-pub -r expanded 2>&1 | tee flutter-test.log

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-log
          path: flutter-test.log
          if-no-files-found: error
          retention-days: 1

      - name: Preserve test failure
        if: steps.test.outcome == 'failure'
        run: exit 1
