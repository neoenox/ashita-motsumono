進行中のRelease sessionは誤操作防止のため拒否されます。明示的に中断して退避する場合だけ`-ForceArchiveActive`を付けます。退避先に`archive-manifest.json`を作成し、元の証跡は削除しません。異なるSource SHAのsessionを上書きしません。
''',
