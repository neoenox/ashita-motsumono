- 各ケースのstatus・verdict・Alarm予定時刻照合・Wait結果
- 参照すべき証跡ファイル
- `nextAction`
- コピー可能な`nextCommand`
- 必要な`manualAction`

Windows PowerShell 5.1互換CIでは、4つのPowerShellファイルのparser、Status実行、git未導入時の防御、ISO 8601入力エラー、UTF-8 BOMなしJSON、Alarm予定時刻照合、ArchiveSession安全条件を検証します。
''',
          )

          issue_doc = 'docs/ISSUE60_ANDROID_EMULATOR_VALIDATION.md'
          replace_once(
