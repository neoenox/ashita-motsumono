              "    expect(releaseText, contains('Todo作成前後のAlarm登録差分'));\n",
              "    expect(releaseText, contains('Todo作成前後のAlarm登録差分'));\n    expect(sessionText, contains('ArchiveSession'));\n    expect(sessionText, contains('ExpectedTimeMatch'));\n    expect(sessionText, contains('Windows PowerShell 5.1'));\n",
          )

          workflow = '.github/workflows/issue60-evidence-tool.yml'
          windows_job = r'''  windows-powershell51:
    name: Windows PowerShell 5.1 compatibility
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse tools with Windows PowerShell 5.1
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Windows PowerShell 5.1 required; got $($PSVersionTable.PSVersion)"
          }
          $failed = $false
          $files = @(
            Get-ChildItem tool/issue60_emulator_evidence*.ps1
            Get-Item tool/release_validation_session.ps1
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              foreach ($parseError in $errors) {
                Write-Error (
                  "{0}:{1}:{2}: {3}" -f (
                    $file.Name,
                    $parseError.Extent.StartLineNumber,
                    $parseError.Extent.StartColumnNumber,
                    $parseError.Message
                  )
                )
              }
            }
          }
          if ($failed) { exit 1 }

      - name: Verify Status, UTF-8 BOM, missing git, and ISO validation
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'release-status-smoke'
          . .\tool\release_validation_session.ps1 `
            -Action Status `
            -EvidenceRoot $root | Out-Null

          $jsonPath = Join-Path $root 'encoding-smoke.json'
          Write-JsonFile ([ordered]@{ text = '日本語'; value = 1 }) $jsonPath
          $bytes = [IO.File]::ReadAllBytes($jsonPath)
          if (
            $bytes.Length -ge 3 -and
            $bytes[0] -eq 0xEF -and
            $bytes[1] -eq 0xBB -and
            $bytes[2] -eq 0xBF
          ) {
            throw 'UTF-8 BOM must not be present'
          }
          $roundTrip = Read-JsonFile $jsonPath
          if ($roundTrip.text -ne '日本語') {
            throw 'UTF-8 round trip failed'
          }

          $invalidRejected = $false
          try {
            Resolve-ExpectedTime -Value 'not-an-iso-time' -Lead 12 | Out-Null
          }
          catch {
            if ($_.Exception.Message -match 'ExpectedTime must be ISO 8601') {
              $invalidRejected = $true
            }
          }
          if (-not $invalidRejected) {
            throw 'invalid ExpectedTime was not rejected clearly'
          }

          $oldPath = $env:PATH
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            $status = Show-Status
            if ($status.git.gate -ne 'UNKNOWN') {
              throw 'Status should report UNKNOWN when git is unavailable'
            }
          }
          finally {
            $env:PATH = $oldPath
          }

      - name: Verify Alarm expected-time matching
        shell: powershell
        run: |
          $PackageName = 'com.ashita_motsumono'
          $ExpectedTime = '2026-07-13T18:30:00+09:00'
          . .\tool\issue60_emulator_evidence_core.ps1
          $root = Join-Path $env:RUNNER_TEMP 'alarm-time-smoke'
          $before = Join-Path $root 'before'
          $after = Join-Path $root 'after'
          New-Item -ItemType Directory -Force $before, $after | Out-Null
          @'
          Pending alarm batches:
          '@ | Set-Content (Join-Path $before 'alarm.txt') -Encoding utf8
          @'
          RTC_WAKEUP #0: Alarm{abc type 0 when=2026-07-13 18:30:00+09:00}
            tag=*walarm*:com.ashita_motsumono
            operation=PendingIntent{ScheduledNotificationReceiver flutterlocalnotifications}
          '@ | Set-Content (Join-Path $after 'alarm.txt') -Encoding utf8
          $result = AlarmRegistration `
            $before `
            $after `
            (Join-Path $root 'alarm-registration.json')
          if ($result.Result -ne 'PASS') {
            throw "expected registration PASS, got $($result.Result)"
          }
          if ($result.ExpectedTimeMatch -ne 'PASS') {
            throw "expected time match PASS, got $($result.ExpectedTimeMatch)"
          }
          $ExpectedTime = '2026-07-13T19:30:00+09:00'
          $mismatch = AlarmRegistration `
            $before `
            $after `
            (Join-Path $root 'alarm-registration-mismatch.json')
          if ($mismatch.Result -ne 'INCONCLUSIVE') {
            throw 'mismatched alarm time must not PASS'
          }
          if ($mismatch.ExpectedTimeMatch -ne 'MISMATCH') {
            throw 'mismatched alarm time was not identified'
          }

      - name: Verify ArchiveSession safety
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'archive-session-smoke'
          New-Item -ItemType Directory -Force $root | Out-Null
          [IO.File]::WriteAllText(
            (Join-Path $root 'release-session.json'),
            '{"sourceSha":"abc123"}',
            [Text.UTF8Encoding]::new($false)
          )
          [IO.File]::WriteAllText(
            (Join-Path $root 'release-validation-state.json'),
            '{"sessionStarted":true,"sourceSha":"abc123","cases":{"normal":null,"reboot":null,"install-r":null}}',
            [Text.UTF8Encoding]::new($false)
          )
          $blocked = $false
          try {
            & .\tool\release_validation_session.ps1 `
              -Action ArchiveSession `
              -EvidenceRoot $root | Out-Null
          }
          catch {
            if ($_.Exception.Message -match 'active release session') {
              $blocked = $true
            }
          }
          if (-not $blocked) {
            throw 'active session archive must require ForceArchiveActive'
          }
          $archive = & .\tool\release_validation_session.ps1 `
            -Action ArchiveSession `
            -ForceArchiveActive `
            -EvidenceRoot $root
          if ($archive.result -ne 'ARCHIVED') {
            throw 'forced archive did not complete'
          }
          if (-not (Test-Path (Join-Path $archive.destination 'archive-manifest.json'))) {
            throw 'archive-manifest.json missing'
          }

'''
          replace_once(workflow, '  contract:\n', windows_job + '  contract:\n')
          replace_once(
              workflow,
              "             'AddedLineCount',\n",
              "             'AddedLineCount',\n             'ExpectedTimeMatch',\n             'AddedTimeCandidates',\n             \"'ArchiveSession'\",\n             'archive-manifest.json',\n             'ForceArchiveActive',\n             'notificationPermission',\n",
          )

          runbook = 'docs/RELEASE_VALIDATION_SESSION.md'
          replace_once(
              runbook,
              '既存の別Release sessionが`$evidence`に残っている場合は、内容を保存して別フォルダーへ移動してから開始します。異なるSource SHAのsessionを上書きしません。\n',
              r'''既存の証跡が残っている場合は、削除や手動移動ではなく`ArchiveSession`を使用します。

```powershell
