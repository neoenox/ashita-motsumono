              "      contains(r\"$r.Result -eq 'PASS' -and [int]$r.AddedLineCount -gt 0\"),\n",
              "      contains(r\"$r.Result -eq 'PASS' -and [int]$r.AddedLineCount -gt 0\"),\n",
          )
          replace_once(
              test,
              "    expect(casesText, contains('AlarmRegistrationEvidence'));\n",
              "    expect(casesText, contains(r\"$r.ExpectedTimeMatch -eq 'PASS'\"));\n    expect(casesText, contains('AlarmRegistrationEvidence'));\n",
          )
          replace_once(
