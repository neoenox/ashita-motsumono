name: Apply release validation hardening

on:
  push:
    branches:
      - agent/release-validation-hardening
    paths:
      - '.github/workflows/apply-release-validation-hardening.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply hardening changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'anchor not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          session = 'tool/release_validation_session.ps1'
          replace_once(
              session,
              "    'Doctor',\n",
              "    'ArchiveSession',\n    'Doctor',\n",
          )
          replace_once(
              session,
              "  [switch]$InstallBroadcastUnverified,\n  [switch]$ReportOnly\n",
              "  [switch]$InstallBroadcastUnverified,\n  [switch]$ForceArchiveActive,\n  [switch]$ReportOnly\n",
          )
          replace_once(
              session,
              "$ScriptDirectory = Split-Path -Parent $MyInvocation.MyCommand.Path\n",
              "$SessionToolPath = $MyInvocation.MyCommand.Path\n$ScriptDirectory = Split-Path -Parent $SessionToolPath\n",
          )
          replace_once(
              session,
              "function Default-LeadMinutes {\n",
              r'''function Resolve-ExpectedTime {
  param(
    [string]$Value,
    [Parameter(Mandatory)][int]$Lead
  )
  $resolved = if ($Value) {
    $parsed = [DateTimeOffset]::MinValue
    if (-not [DateTimeOffset]::TryParse(
        $Value,
        [Globalization.CultureInfo]::InvariantCulture,
        [Globalization.DateTimeStyles]::RoundtripKind,
        [ref]$parsed
      )) {
      throw 'ExpectedTime must be ISO 8601'
    }
    $parsed
  }
  else {
    if ($Lead -lt 5) {
      throw 'LeadMinutes must be at least 5'
    }
    [DateTimeOffset]::Now.AddMinutes($Lead)
  }
  $rounded = Round-UpToMinute $resolved
  if ($rounded -le [DateTimeOffset]::Now.AddMinutes(4)) {
    throw 'ExpectedTime must be at least 4 minutes in the future'
  }
  $rounded
}

function Default-LeadMinutes {
''',
          )
          replace_once(
              session,
              r'''  $expected = if ($ExpectedTime) {
    $parsed = [DateTimeOffset]::MinValue
    if (-not [DateTimeOffset]::TryParse(
        $ExpectedTime,
        [Globalization.CultureInfo]::InvariantCulture,
        [Globalization.DateTimeStyles]::RoundtripKind,
        [ref]$parsed
      )) {
      throw 'ExpectedTime must be ISO 8601'
    }
    Round-UpToMinute $parsed
  }
  else {
    Round-UpToMinute ([DateTimeOffset]::Now.AddMinutes($lead))
  }
  if ($expected -le [DateTimeOffset]::Now.AddMinutes(4)) {
    throw 'ExpectedTime must be at least 4 minutes in the future'
  }
''',
              r'''  $expected = Resolve-ExpectedTime `
    -Value $ExpectedTime `
    -Lead $lead
''',
          )

