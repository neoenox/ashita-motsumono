          new_status = r'''function Get-OptionalProperty {
  param(
    $Object,
    [Parameter(Mandatory)][string]$Name,
    $Default = $null
  )
  if ($null -eq $Object) {
    return $Default
  }
  $property = $Object.PSObject.Properties[$Name]
  if ($property) {
    return $property.Value
  }
  $Default
}

function Read-OptionalJson {
  param([Parameter(Mandatory)][string]$Path)
  if (-not (Test-Path $Path)) {
    return $null
  }
  try {
    Read-JsonFile $Path
  }
  catch {
    [pscustomobject][ordered]@{
      readError = $_.Exception.Message
      path = (Get-FullPath $Path)
    }
  }
}

function Get-CaseDiagnostic {
  param(
    [Parameter(Mandatory)]$State,
    [Parameter(Mandatory)][string]$Type
  )
  $property = $State.cases.PSObject.Properties[$Type]
  if (-not $property -or -not $property.Value) {
    return [pscustomobject][ordered]@{
      caseType = $Type
      planned = $false
      status = 'NOT_STARTED'
      verdict = ''
      caseName = ''
      alarmRegistration = $null
      wait = $null
      result = $null
      evidenceFiles = @()
    }
  }
  $case = $property.Value
  $caseName = [string](Get-OptionalProperty $case 'caseName' '')
  $directory = if ($caseName) {
    Join-Path $EvidenceRoot $caseName
  }
  else {
    ''
  }
  $registrationPath = if ($directory) {
    Join-Path $directory 'alarm-registration.json'
  }
  else {
    ''
  }
  $waitPath = if ($directory) {
    Join-Path $directory 'wait-result.json'
  }
  else {
    ''
  }
  $resultPath = if ($directory) {
    Join-Path $directory 'case-result.json'
  }
  else {
    ''
  }
  $registration = if ($registrationPath) {
    Read-OptionalJson $registrationPath
  }
  else {
    $null
  }
  $wait = if ($waitPath) {
    Read-OptionalJson $waitPath
  }
  else {
    $null
  }
  $result = if ($resultPath) {
    Read-OptionalJson $resultPath
  }
  else {
    $null
  }
  $evidenceFiles = @(
    $registrationPath,
    $waitPath,
    $resultPath
  ) | Where-Object { $_ -and (Test-Path $_) }
  [pscustomobject][ordered]@{
    caseType = $Type
    planned = $true
    status = [string](Get-OptionalProperty $case 'status' 'UNKNOWN')
    verdict = [string](Get-OptionalProperty $case 'verdict' '')
    caseName = $caseName
    todoTitle = [string](Get-OptionalProperty $case 'todoTitle' '')
    expectedTime = [string](Get-OptionalProperty $case 'expectedTime' '')
    alarmRegistration = $registration
    alarmExpectedTimeMatch = [string](
      Get-OptionalProperty $registration 'ExpectedTimeMatch' ''
    )
    wait = $wait
    result = $result
    evidenceFiles = @($evidenceFiles)
  }
}

function Archive-ReleaseSession {
  $root = Get-FullPath $EvidenceRoot
  $items = @(
    Get-ChildItem -LiteralPath $root -Force -ErrorAction SilentlyContinue
  )
  if ($items.Count -eq 0) {
    return [pscustomobject][ordered]@{
      result = 'NO_EVIDENCE'
      source = $root
      destination = ''
      forced = $ForceArchiveActive.IsPresent
    }
  }

  $state = Read-OptionalJson $StatePath
  $session = Read-OptionalJson $SessionPath
  $summaryPath = Join-Path (
    Join-Path $root 'ISSUE60_SUMMARY'
  ) 'issue60-summary.json'
  $active = (
    $null -ne $session -and
    -not (Test-Path $summaryPath)
  )
  if ($active -and -not $ForceArchiveActive) {
    throw (
      'active release session cannot be archived without ' +
      '-ForceArchiveActive'
    )
  }

  $parent = [IO.Path]::GetDirectoryName($root)
  $leaf = [IO.Path]::GetFileName($root.TrimEnd(
    [IO.Path]::DirectorySeparatorChar,
    [IO.Path]::AltDirectorySeparatorChar
  ))
  $stamp = Get-Date -Format 'yyyyMMdd-HHmmss'
  $destination = Join-Path $parent "$leaf-archive-$stamp"
  $suffix = 1
  while (Test-Path $destination) {
    $destination = Join-Path $parent "$leaf-archive-$stamp-$suffix"
    $suffix++
  }

  $sourceSha = [string](Get-OptionalProperty $session 'sourceSha' '')
  Move-Item -LiteralPath $root -Destination $destination
  New-Item -ItemType Directory -Force $root | Out-Null
  $manifest = [pscustomobject][ordered]@{
    result = 'ARCHIVED'
    source = $root
    destination = $destination
    archivedAt = Get-Date -Format o
    sourceSha = $sourceSha
    sessionWasActive = [bool]$active
    forced = $ForceArchiveActive.IsPresent
    previousState = $state
  }
  Write-JsonFile $manifest (Join-Path $destination 'archive-manifest.json')
  Write-JsonFile $manifest (Join-Path $root 'archive-last-result.json')
  $manifest
}

function Show-Status {
  $git = Get-GitGate
  $state = Get-State
  $doctor = Read-OptionalJson (
    Join-Path $EvidenceRoot 'release-validation-doctor.json'
  )
  $install = Read-OptionalJson (
    Join-Path (Join-Path $EvidenceRoot 'SETUP_INSTALL') 'install-result.json'
  )
  $appPreflight = Read-OptionalJson (
    Join-Path (Join-Path $EvidenceRoot 'SETUP_APP') 'preflight-result.json'
  )
  $session = Read-OptionalJson $SessionPath
  $report = Read-OptionalJson $ReadinessJsonPath
  $normal = Get-CaseDiagnostic $state 'normal'
  $reboot = Get-CaseDiagnostic $state 'reboot'
  $installCase = Get-CaseDiagnostic $state 'install-r'

  $doctorPassed = (
    [string](Get-OptionalProperty $doctor 'result' '') -eq 'PASS'
  )
  $apkInstalled = (
    [string](Get-OptionalProperty $install 'Result' '') -eq 'PASS'
  )
  $permission = [string](
    Get-OptionalProperty $appPreflight 'Permission' 'UNKNOWN'
  )
  $nextAction = ''
  $nextCommand = ''
  $manualAction = ''

  if (-not $doctorPassed) {
    $nextAction = 'Doctor'
    $nextCommand = ".\tool\release_validation_session.ps1 -Action Doctor -EvidenceRoot `"$EvidenceRoot`""
  }
  elseif (-not $apkInstalled) {
    $nextAction = 'BuildInstall'
    $nextCommand = ".\tool\release_validation_session.ps1 -Action BuildInstall -EvidenceRoot `"$EvidenceRoot`""
  }
  elseif (-not $state.sessionStarted) {
    $nextAction = 'StartSession'
    $manualAction = 'Open the app once, grant notification permission, return Home.'
    $nextCommand = ".\tool\release_validation_session.ps1 -Action StartSession -EvidenceRoot `"$EvidenceRoot`""
  }
  elseif (-not $normal.planned) {
    $nextAction = 'PlanCase'
    $nextCommand = ".\tool\release_validation_session.ps1 -Action PlanCase -CaseType normal -EvidenceRoot `"$EvidenceRoot`""
  }
  elseif ($normal.status -eq 'PLANNED') {
    $nextAction = 'BeginCase'
    $manualAction = "Create Todo $($normal.todoTitle), save, go Home, do not reopen."
    $nextCommand = ".\tool\release_validation_session.ps1 -Action BeginCase -CaseType normal -EvidenceRoot `"$EvidenceRoot`""
  }
  elseif ($normal.status -eq 'BEGUN') {
    if (
      [string](Get-OptionalProperty $normal.alarmRegistration 'Result' '') -eq 'PASS'
    ) {
      $nextAction = 'WaitCase'
      $nextCommand = ".\tool\release_validation_session.ps1 -Action WaitCase -CaseType normal -EvidenceRoot `"$EvidenceRoot`""
    }
    else {
      $nextAction = 'FinalizeCase'
      $nextCommand = ".\tool\release_validation_session.ps1 -Action FinalizeCase -CaseType normal -Verdict INCONCLUSIVE -Notes `"Alarm registration or expected-time evidence incomplete`" -EvidenceRoot `"$EvidenceRoot`""
    }
  }
  elseif ($normal.status -eq 'WAITED') {
    $nextAction = 'FinalizeCase'
    $manualAction = 'Review notification title, screenshot, notification dump, and wait result.'
    $nextCommand = ".\tool\release_validation_session.ps1 -Action FinalizeCase -CaseType normal -Verdict PASS -Notes `"Notification verified`" -EvidenceRoot `"$EvidenceRoot`""
  }
  elseif ($normal.verdict -ne 'PASS') {
    $nextAction = 'PlanCase'
    $nextCommand = ".\tool\release_validation_session.ps1 -Action PlanCase -CaseType normal -EvidenceRoot `"$EvidenceRoot`""
  }
  elseif (-not $reboot.planned) {
    $nextAction = 'PlanCase'
    $nextCommand = ".\tool\release_validation_session.ps1 -Action PlanCase -CaseType reboot -EvidenceRoot `"$EvidenceRoot`""
  }
  elseif ($reboot.status -eq 'PLANNED') {
    $nextAction = 'BeginCase'
    $manualAction = "Create Todo $($reboot.todoTitle), save, go Home, do not reopen."
    $nextCommand = ".\tool\release_validation_session.ps1 -Action BeginCase -CaseType reboot -EvidenceRoot `"$EvidenceRoot`""
  }
  elseif ($reboot.status -eq 'BEGUN') {
    $nextAction = 'MutateCase'
    $nextCommand = ".\tool\release_validation_session.ps1 -Action MutateCase -CaseType reboot -EvidenceRoot `"$EvidenceRoot`""
  }
  elseif ($reboot.status -eq 'MUTATED') {
    $nextAction = 'WaitCase'
    $nextCommand = ".\tool\release_validation_session.ps1 -Action WaitCase -CaseType reboot -EvidenceRoot `"$EvidenceRoot`""
  }
  elseif ($reboot.status -eq 'WAITED') {
    $nextAction = 'FinalizeCase'
    $manualAction = 'Review reboot notification evidence before selecting a verdict.'
    $nextCommand = ".\tool\release_validation_session.ps1 -Action FinalizeCase -CaseType reboot -Verdict PASS -Notes `"Reboot notification verified`" -EvidenceRoot `"$EvidenceRoot`""
  }
  elseif ($reboot.verdict -ne 'PASS') {
    $nextAction = 'PlanCase'
    $nextCommand = ".\tool\release_validation_session.ps1 -Action PlanCase -CaseType reboot -EvidenceRoot `"$EvidenceRoot`""
  }
  elseif (-not $installCase.planned) {
    $nextAction = 'PlanCase'
    $nextCommand = ".\tool\release_validation_session.ps1 -Action PlanCase -CaseType install-r -EvidenceRoot `"$EvidenceRoot`""
  }
  elseif ($installCase.status -eq 'PLANNED') {
    $nextAction = 'BeginCase'
    $manualAction = "Create Todo $($installCase.todoTitle), save, go Home, do not reopen."
    $nextCommand = ".\tool\release_validation_session.ps1 -Action BeginCase -CaseType install-r -EvidenceRoot `"$EvidenceRoot`""
  }
  elseif ($installCase.status -eq 'BEGUN') {
    $nextAction = 'MutateCase'
    $nextCommand = ".\tool\release_validation_session.ps1 -Action MutateCase -CaseType install-r -EvidenceRoot `"$EvidenceRoot`""
  }
  elseif ($installCase.status -eq 'MUTATED') {
    $nextAction = 'WaitCase'
    $nextCommand = ".\tool\release_validation_session.ps1 -Action WaitCase -CaseType install-r -EvidenceRoot `"$EvidenceRoot`""
  }
  elseif ($installCase.status -eq 'WAITED') {
    $nextAction = 'FinalizeCase'
    $manualAction = 'Review install-r notification and MY_PACKAGE_REPLACED evidence.'
    $nextCommand = ".\tool\release_validation_session.ps1 -Action FinalizeCase -CaseType install-r -Verdict INCONCLUSIVE -InstallBroadcastUnverified -Notes `"install-r notification verified; broadcast causality unverified`" -EvidenceRoot `"$EvidenceRoot`""
  }
  elseif ($installCase.status -ne 'FINALIZED') {
    $nextAction = 'CompleteInstallCase'
    $nextCommand = ".\tool\release_validation_session.ps1 -Action Status -EvidenceRoot `"$EvidenceRoot`""
  }
  else {
    $nextAction = 'Aggregate'
    $nextCommand = ".\tool\release_validation_session.ps1 -Action Aggregate -EvidenceRoot `"$EvidenceRoot`""
  }

  [pscustomobject][ordered]@{
    git = $git
    doctorPassed = $doctorPassed
    apkInstalled = $apkInstalled
    notificationPermission = $permission
    sessionStarted = [bool]$state.sessionStarted
    sessionSourceSha = [string](Get-OptionalProperty $session 'sourceSha' '')
    cases = [pscustomobject][ordered]@{
      normal = $normal
      reboot = $reboot
      'install-r' = $installCase
    }
    readiness = $report
    nextAction = $nextAction
    nextCommand = $nextCommand
    manualAction = $manualAction
    evidenceFiles = @(
      $StatePath,
      $SessionPath,
      $ReadinessJsonPath,
      $ReadinessMarkdownPath
    ) | Where-Object { Test-Path $_ }
  }
}
'''
          replace_once(session, old_status, new_status)
          replace_once(
