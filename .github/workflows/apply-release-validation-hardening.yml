              "      \"'ArchiveSession'\",\n      \"'Doctor'\",\n",
          )
          replace_once(
              test,
              "      'host UTC offset must be +09:00',\n",
              "      'host UTC offset must be +09:00',\n      'archive-manifest.json',\n      'ForceArchiveActive',\n      'notificationPermission',\n      'nextAction',\n      'manualAction',\n      'Resolve-ExpectedTime',\n",
