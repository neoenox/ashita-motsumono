name: Release Gate Validation

on:
  push:
    branches:
      - feat/release-gate
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run requested validation commands
        shell: bash
        run: |
          set +e
          output_dir="$RUNNER_TEMP/release-gate-validation"
          mkdir -p "$output_dir"
          failures=0

          run_check() {
            label="$1"
            file_name="$2"
            shift 2
            echo "::group::${label}"
            "$@" 2>&1 | tee "$output_dir/$file_name.txt"
            status=${PIPESTATUS[0]}
            echo "$status" > "$output_dir/$file_name.exit-code.txt"
            echo "${label} exit code: ${status}"
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              failures=$((failures + 1))
            fi
          }

          run_check "dart format" "dart-format" \
            dart format \
            tool/release_gate.dart \
            tool/src/release_audit.dart \
            test/tool/release_audit_test.dart

          mkdir -p \
            "$output_dir/formatted/tool/src" \
            "$output_dir/formatted/test/tool"
          cp tool/release_gate.dart "$output_dir/formatted/tool/release_gate.dart"
          cp tool/src/release_audit.dart \
            "$output_dir/formatted/tool/src/release_audit.dart"
          cp test/tool/release_audit_test.dart \
            "$output_dir/formatted/test/tool/release_audit_test.dart"

          run_check "flutter analyze" "flutter-analyze" flutter analyze
          run_check "flutter test" "flutter-test" flutter test
          run_check "release gate" "release-gate" \
            dart run tool/release_gate.dart

          echo "$failures" > "$output_dir/failure-count.txt"
          echo "Validation command failures: ${failures}"
          exit "$failures"

      - name: Upload validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-validation-output
          path: ${{ runner.temp }}/release-gate-validation
          if-no-files-found: error
          retention-days: 7
