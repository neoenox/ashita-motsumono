name: Diagnose Flutter Analyze

on:
  pull_request:
  workflow_dispatch:

jobs:
  diagnose-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Capture analyze output
        id: analyze
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee flutter-analyze.log

      - name: Upload analyze output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-log
          path: flutter-analyze.log
          if-no-files-found: error
          retention-days: 1

      - name: Preserve analyze failure
        if: steps.analyze.outcome == 'failure'
        run: exit 1
