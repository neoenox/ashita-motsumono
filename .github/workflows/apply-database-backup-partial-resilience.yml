name: Apply database backup partial resilience

on:
  pull_request:
    types: [synchronize]
    branches: [master]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: >-
      github.event.pull_request.head.ref == 'agent/source-review-database-backup-20260805' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: agent/source-review-database-backup-20260805
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Apply patch
        run: python3 tool/apply_database_backup_partial_resilience.py

      - name: Validate patch
        run: |
          dart format lib/src/repositories/app_database.dart test/database_backup_sidecar_test.dart
          flutter pub get
          flutter test test/database_backup_sidecar_test.dart
          git diff --check

      - name: Remove one-shot tooling
        run: |
          rm tool/apply_database_backup_partial_resilience.py
          rm .github/workflows/apply-database-backup-partial-resilience.yml

      - name: Commit source changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/repositories/app_database.dart test/database_backup_sidecar_test.dart
          git add -u tool/apply_database_backup_partial_resilience.py .github/workflows/apply-database-backup-partial-resilience.yml
          git commit -m "fix: preserve partial corrupt database backups"
          git push origin HEAD:agent/source-review-database-backup-20260805
