name: Repair PR 133 test cleanup

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: repair-pr-133-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.head_ref == 'fix/v0.6.3-release-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Repair widget-test cleanup and restore workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('test/widget_test.dart')
          text = path.read_text(encoding='utf-8')

          malformed_prefs = """      SharedPreferences.setMockInitialValues({
            'onboarding_completed_v1': true,
            'notification_info_shown_v1': true,
          });""".replace("            'onboarding", "  'onboarding").replace(
              "            'notification", "  'notification"
          ).replace("          });", "});")
          formatted_prefs = """      SharedPreferences.setMockInitialValues({
            'onboarding_completed_v1': true,
            'notification_info_shown_v1': true,
          });"""
          if malformed_prefs in text:
              text = text.replace(malformed_prefs, formatted_prefs, 1)
          elif formatted_prefs not in text:
              raise SystemExit('HomeScreen preference formatting target was not found')

          helper_before = "  await appState.load();\n  return appState;"
          helper_after = (
              "  await appState.load();\n"
              "  addTearDown(appState.close);\n"
              "  return appState;"
          )
          if helper_before in text:
              text = text.replace(helper_before, helper_after, 1)
          elif helper_after not in text:
              raise SystemExit('AppState helper cleanup target was not found')

          first_before = "      await appState.load();\n\n      await tester.pumpWidget("
          first_after = (
              "      await appState.load();\n"
              "      addTearDown(appState.close);\n\n"
              "      await tester.pumpWidget("
          )
          if first_before in text:
              text = text.replace(first_before, first_after, 1)
          elif first_after not in text:
              raise SystemExit('first HomeScreen test cleanup target was not found')

          path.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/flutter-test-diagnostics.yml
          git fetch origin master
          git checkout origin/master -- .github/workflows/ci.yml

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/widget_test.dart .github/workflows/ci.yml
          git add -u .github/workflows/flutter-test-diagnostics.yml
          git commit -m 'test: close HomeScreen AppState instances'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
