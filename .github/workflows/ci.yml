name: Flutter CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Android notification manifest
        run: python3 tool/verify_android_manifest.py

      - name: Test Android release signing transform
        run: python3 -m unittest tool/test_enforce_android_release_signing.py

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Generate LP screenshots
        run: flutter test tool/generate_lp_screenshots_test.dart

      - name: Validate LP screenshots
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct

          expected = {
              'home-tomorrow.png': (1080, 1920),
              'review-extraction.png': (1080, 1920),
              'all-complete.png': (1080, 1920),
          }

          for name, dimensions in expected.items():
              path = Path('build/lp-screenshots') / name
              data = path.read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', f'{name}: PNG signature mismatch'
              width, height = struct.unpack('>II', data[16:24])
              assert (width, height) == dimensions, (
                  f'{name}: expected {dimensions}, got {(width, height)}'
              )
              assert len(data) > 10_000, f'{name}: file is unexpectedly small'
              print(f'{name}: {width}x{height}, {len(data)} bytes')
          PY

      - name: Upload LP screenshots
        uses: actions/upload-artifact@v4
        with:
          name: lp-screenshots
          path: build/lp-screenshots/*.png
          if-no-files-found: error
          retention-days: 7

  release-build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: bash tool/create_platforms.sh

      - name: Apply Android release configuration
        run: bash tool/configure_android_release.sh

      - name: Validate required secrets
        shell: bash
        run: |
          missing=()
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then missing+=("KEYSTORE_BASE64"); fi
          if [ -z "${{ secrets.KEYSTORE_STORE_PASSWORD }}" ]; then missing+=("KEYSTORE_STORE_PASSWORD"); fi
          if [ -z "${{ secrets.KEYSTORE_KEY_ALIAS }}" ]; then missing+=("KEYSTORE_KEY_ALIAS"); fi
          if [ -z "${{ secrets.KEYSTORE_KEY_PASSWORD }}" ]; then missing+=("KEYSTORE_KEY_PASSWORD"); fi
          if [ -z "${{ secrets.ADMOB_APP_ID }}" ]; then missing+=("ADMOB_APP_ID"); fi
          if [ -z "${{ secrets.ADMOB_BANNER_AD_UNIT_ID }}" ]; then missing+=("ADMOB_BANNER_AD_UNIT_ID"); fi
          if [ -z "${{ secrets.GEMINI_PROXY_URL }}" ]; then missing+=("GEMINI_PROXY_URL"); fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Restore Android upload keystore
        shell: bash
        run: |
          set -euo pipefail

          echo "::add-mask::${{ secrets.KEYSTORE_STORE_PASSWORD }}"
          echo "::add-mask::${{ secrets.KEYSTORE_KEY_PASSWORD }}"
          echo "::add-mask::${{ secrets.KEYSTORE_KEY_ALIAS }}"

          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

          cat > android/key.properties <<EOF
          storeFile=app/upload-keystore.jks
          storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}
          keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          EOF

      - name: Show runner memory and versions
        run: |
          free -h
          df -h
          java -version
          flutter --version

      - name: Build release APK (signed)
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: >
          flutter build apk --release
          --dart-define=ADMOB_BANNER_AD_UNIT_ID=${{ secrets.ADMOB_BANNER_AD_UNIT_ID }}
          --dart-define=IAP_REMOVE_ADS_PRODUCT_ID=remove_ads
          --dart-define=GEMINI_PROXY_URL=${{ secrets.GEMINI_PROXY_URL }}

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ashita-motsumono-signed-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build release AAB (signed, for Play Console submission)
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: >
          flutter build appbundle --release
          --dart-define=ADMOB_BANNER_AD_UNIT_ID=${{ secrets.ADMOB_BANNER_AD_UNIT_ID }}
          --dart-define=IAP_REMOVE_ADS_PRODUCT_ID=remove_ads
          --dart-define=GEMINI_PROXY_URL=${{ secrets.GEMINI_PROXY_URL }}

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ashita-motsumono-signed-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

  # BEGIN TEMPORARY VERSION SYNC JOB
  apply-version-sync:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/sync-displayed-version' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply synchronized version handling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          pubspec = Path('pubspec.yaml').read_text(encoding='utf-8')
          match = re.search(r'^version:\s*([^\s#]+)', pubspec, flags=re.MULTILINE)
          if match is None:
              raise SystemExit('pubspec.yaml version was not found')
          version = match.group(1)

          Path('lib/src/app_version.g.dart').write_text(
              "// GENERATED FILE. Run `python3 tool/sync_app_version.py --write` after changing pubspec.yaml.\n"
              "// Do not edit this file manually.\n\n"
              f"const appVersion = '{version}';\n",
              encoding='utf-8',
          )

          settings_path = Path('lib/src/screens/settings_screen.dart')
          settings = settings_path.read_text(encoding='utf-8')
          if "import '../app_version.g.dart';" not in settings:
              settings = settings.replace(
                  "import '../app_state.dart';",
                  "import '../app_state.dart';\nimport '../app_version.g.dart';",
                  1,
              )
          settings, count = re.subn(
              r"'Version\s+[^']+'",
              "'Version $appVersion'",
              settings,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'expected one displayed version literal, found {count}')
          settings_path.write_text(settings, encoding='utf-8')

          script = '''#!/usr/bin/env python3
          """Keep the generated in-app version constant synchronized with pubspec.yaml."""

          from __future__ import annotations

          import argparse
          from pathlib import Path
          import re
          import sys

          ROOT = Path(__file__).resolve().parents[1]
          PUBSPEC = ROOT / "pubspec.yaml"
          GENERATED = ROOT / "lib/src/app_version.g.dart"


          def read_version() -> str:
              text = PUBSPEC.read_text(encoding="utf-8")
              match = re.search(r"^version:\\s*([^\\s#]+)", text, flags=re.MULTILINE)
              if match is None:
                  raise RuntimeError("pubspec.yaml version was not found")
              return match.group(1)


          def render(version: str) -> str:
              return (
                  "// GENERATED FILE. Run `python3 tool/sync_app_version.py --write` "
                  "after changing pubspec.yaml.\\n"
                  "// Do not edit this file manually.\\n\\n"
                  f"const appVersion = '{version}';\\n"
              )


          def main() -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument("--write", action="store_true")
              args = parser.parse_args()
              expected = render(read_version())
              if args.write:
                  GENERATED.write_text(expected, encoding="utf-8")
                  return 0
              actual = GENERATED.read_text(encoding="utf-8") if GENERATED.exists() else ""
              if actual != expected:
                  print(
                      "Displayed app version is out of sync. "
                      "Run: python3 tool/sync_app_version.py --write",
                      file=sys.stderr,
                  )
                  return 1
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          '''
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in script.splitlines()
          ) + '\n'
          script_path = Path('tool/sync_app_version.py')
          script_path.write_text(script, encoding='utf-8')
          script_path.chmod(0o755)

          ci_path = Path('.github/workflows/ci.yml')
          ci = ci_path.read_text(encoding='utf-8')
          if 'Verify displayed app version' not in ci:
              marker = "      - name: Verify Android notification manifest\n"
              step = (
                  "      - name: Verify displayed app version\n"
                  "        run: python3 tool/sync_app_version.py\n\n"
              )
              if marker not in ci:
                  raise SystemExit('CI insertion point was not found')
              ci = ci.replace(marker, step + marker, 1)
          ci, removed = re.subn(
              r"\n  # BEGIN TEMPORARY VERSION SYNC JOB\n[\s\S]*\Z",
              "\n",
              ci,
              count=1,
          )
          if removed != 1:
              raise SystemExit('temporary CI job was not found')
          ci_path.write_text(ci, encoding='utf-8')

          todo_path = Path('docs/TODO.md')
          todo = todo_path.read_text(encoding='utf-8')
          todo_item = '- [x] 設定画面のバージョン表示を`pubspec.yaml`から生成し、CIで同期を検証する。\n'
          if todo_item not in todo:
              marker = '## v0.7以降の候補\n'
              if marker not in todo:
                  raise SystemExit('TODO insertion point was not found')
              todo = todo.replace(marker, todo_item + '\n' + marker, 1)
              todo_path.write_text(todo, encoding='utf-8')

          checklist_path = Path('docs/PLAY_CONSOLE_SUBMISSION.md')
          checklist = checklist_path.read_text(encoding='utf-8')
          checklist_item = '- [x] 設定画面の表示バージョンが`pubspec.yaml`と一致することをCIで確認する\n'
          if checklist_item not in checklist:
              marker = '- [ ] Android実機でカメラ撮影、画像選択、日本語OCR、通知許可、通知予約を確認する\n'
              if marker not in checklist:
                  raise SystemExit('Play checklist insertion point was not found')
              checklist = checklist.replace(marker, checklist_item + marker, 1)
              checklist_path.write_text(checklist, encoding='utf-8')

          Path('.github/workflows/apply-version-sync.yml').unlink()
          PY

          python3 tool/sync_app_version.py
          git diff --check

      - name: Commit synchronized version handling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: sync displayed version with pubspec"
          git push origin HEAD:${{ github.head_ref }}
