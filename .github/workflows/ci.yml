name: Flutter CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify displayed app version
        run: python3 tool/sync_app_version.py

      - name: Verify Android notification manifest
        run: python3 tool/verify_android_manifest.py

      - name: Test Android release signing transform
        run: python3 -m unittest tool/test_enforce_android_release_signing.py

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Generate LP screenshots
        run: flutter test tool/generate_lp_screenshots_test.dart

      - name: Validate LP screenshots
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct

          expected = {
              'home-tomorrow.png': (1080, 1920),
              'review-extraction.png': (1080, 1920),
              'all-complete.png': (1080, 1920),
          }

          for name, dimensions in expected.items():
              path = Path('build/lp-screenshots') / name
              data = path.read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', f'{name}: PNG signature mismatch'
              width, height = struct.unpack('>II', data[16:24])
              assert (width, height) == dimensions, (
                  f'{name}: expected {dimensions}, got {(width, height)}'
              )
              assert len(data) > 10_000, f'{name}: file is unexpectedly small'
              print(f'{name}: {width}x{height}, {len(data)} bytes')
          PY

      - name: Upload LP screenshots
        uses: actions/upload-artifact@v4
        with:
          name: lp-screenshots
          path: build/lp-screenshots/*.png
          if-no-files-found: error
          retention-days: 7

  record-master-status:
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Record master validation status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.analyze-and-test.result }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          state=failure
          description="Flutter CI failed"
          if [[ "$RESULT" == "success" ]]; then
            state=success
            description="Flutter CI passed"
          fi

          python3 - "$state" "$description" "$TARGET_URL" > status.json <<'PY'
          import json
          import sys

          print(json.dumps({
              "state": sys.argv[1],
              "target_url": sys.argv[3],
              "description": sys.argv[2],
              "context": "flutter-ci-master",
          }))
          PY

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data @status.json \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}"

  release-build:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.head_ref == 'agent/release-evidence') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: bash tool/create_platforms.sh

      - name: Apply Android release configuration
        run: bash tool/configure_android_release.sh

      - name: Validate required secrets
        shell: bash
        run: |
          missing=()
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then missing+=("KEYSTORE_BASE64"); fi
          if [ -z "${{ secrets.KEYSTORE_STORE_PASSWORD }}" ]; then missing+=("KEYSTORE_STORE_PASSWORD"); fi
          if [ -z "${{ secrets.KEYSTORE_KEY_ALIAS }}" ]; then missing+=("KEYSTORE_KEY_ALIAS"); fi
          if [ -z "${{ secrets.KEYSTORE_KEY_PASSWORD }}" ]; then missing+=("KEYSTORE_KEY_PASSWORD"); fi
          if [ -z "${{ secrets.ADMOB_APP_ID }}" ]; then missing+=("ADMOB_APP_ID"); fi
          if [ -z "${{ secrets.ADMOB_BANNER_AD_UNIT_ID }}" ]; then missing+=("ADMOB_BANNER_AD_UNIT_ID"); fi
          if [ -z "${{ secrets.GEMINI_PROXY_URL }}" ]; then missing+=("GEMINI_PROXY_URL"); fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Restore Android upload keystore
        shell: bash
        run: |
          set -euo pipefail

          echo "::add-mask::${{ secrets.KEYSTORE_STORE_PASSWORD }}"
          echo "::add-mask::${{ secrets.KEYSTORE_KEY_PASSWORD }}"
          echo "::add-mask::${{ secrets.KEYSTORE_KEY_ALIAS }}"

          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

          cat > android/key.properties <<EOF
          storeFile=app/upload-keystore.jks
          storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}
          keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          EOF

      - name: Show runner memory and versions
        run: |
          free -h
          df -h
          java -version
          flutter --version

      - name: Build release APK (signed)
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: >
          flutter build apk --release
          --dart-define=ADMOB_BANNER_AD_UNIT_ID=${{ secrets.ADMOB_BANNER_AD_UNIT_ID }}
          --dart-define=IAP_REMOVE_ADS_PRODUCT_ID=remove_ads
          --dart-define=GEMINI_PROXY_URL=${{ secrets.GEMINI_PROXY_URL }}

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          mkdir -p build/release-verification
          "$apksigner" verify \
            --verbose \
            --print-certs \
            build/app/outputs/flutter-apk/app-release.apk \
            | tee build/release-verification/apk-signature.txt

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ashita-motsumono-signed-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build release AAB (signed, for Play Console submission)
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: >
          flutter build appbundle --release
          --dart-define=ADMOB_BANNER_AD_UNIT_ID=${{ secrets.ADMOB_BANNER_AD_UNIT_ID }}
          --dart-define=IAP_REMOVE_ADS_PRODUCT_ID=remove_ads
          --dart-define=GEMINI_PROXY_URL=${{ secrets.GEMINI_PROXY_URL }}

      - name: Verify signed AAB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release-verification
          jarsigner \
            -verify \
            -verbose \
            -certs \
            build/app/outputs/bundle/release/app-release.aab \
            | tee build/release-verification/aab-signature.txt

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ashita-motsumono-signed-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

      - name: Upload release verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: ashita-motsumono-release-verification
          path: build/release-verification/*.txt
          if-no-files-found: error
          retention-days: 7
