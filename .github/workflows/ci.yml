name: Flutter CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run requested analysis
        id: analyze
        shell: bash
        run: |
          set +e
          mkdir -p build/diagnostics
          flutter analyze --no-pub 2>&1 | tee build/diagnostics/flutter-analyze.txt
          status=${PIPESTATUS[0]}
          echo "$status" > build/diagnostics/flutter-analyze-status.txt
          exit 0

      - name: Upload analysis diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-diagnostics
          path: build/diagnostics/
          if-no-files-found: error
          retention-days: 1

      - name: Fail when analysis failed
        shell: bash
        run: |
          status="$(cat build/diagnostics/flutter-analyze-status.txt)"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
