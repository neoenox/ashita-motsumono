name: Flutter CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify displayed app version
        run: python3 tool/sync_app_version.py

      - name: Verify Android notification manifest
        run: python3 tool/verify_android_manifest.py

      - name: Test Android release signing transform
        run: python3 -m unittest tool/test_enforce_android_release_signing.py

      - name: Test Android certificate fingerprint verifier
        run: python3 -m unittest tool/test_verify_android_certificate_fingerprint.py

      - name: Test Android release manifest generator
        run: python3 -m unittest tool/test_generate_release_manifest.py

      - name: Test Android release workflow
        run: python3 -m unittest tool/test_release_workflow.py

      - name: Test Google Play state preflight
        run: python3 -m unittest tool/test_play_state_preflight.py

      - name: Test automatic versionCode bump
        run: python3 -m unittest tool/test_bump_app_version.py

      - name: Analyze
        run: python3 tool/run_flutter_analyze.py

      - name: Test
        run: flutter test --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

      - name: Generate LP screenshots
        run: flutter test tool/generate_lp_screenshots_test.dart

      - name: Validate LP screenshots
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct

          expected = {
              'home-tomorrow.png': (1080, 1920),
              'review-extraction.png': (1080, 1920),
              'all-complete.png': (1080, 1920),
          }

          for name, dimensions in expected.items():
              path = Path('build/lp-screenshots') / name
              data = path.read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', f'{name}: PNG signature mismatch'
              width, height = struct.unpack('>II', data[16:24])
              assert (width, height) == dimensions, (
                  f'{name}: expected {dimensions}, got {(width, height)}'
              )
              assert len(data) > 10_000, f'{name}: file is unexpectedly small'
              print(f'{name}: {width}x{height}, {len(data)} bytes')
          PY

      - name: Upload LP screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lp-screenshots
          path: build/lp-screenshots/*.png
          if-no-files-found: error
          retention-days: 7

  record-master-status:
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Record master validation status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.analyze-and-test.result }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          state=failure
          description="Flutter CI failed"
          if [[ "$RESULT" == "success" ]]; then
            state=success
            description="Flutter CI passed"
          fi

          python3 - "$state" "$description" "$TARGET_URL" > status.json <<'PY'
          import json
          import sys

          print(json.dumps({
              "state": sys.argv[1],
              "target_url": sys.argv[3],
              "description": sys.argv[2],
              "context": "flutter-ci-master",
          }))
          PY

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data @status.json \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}"

  release-build:
    needs: analyze-and-test
    if: >-
      needs.analyze-and-test.result == 'success' &&
      (
        startsWith(github.ref, 'refs/tags/v') ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/master'
        )
      )
    runs-on: ubuntu-latest
    env:
      IAP_REMOVE_ADS_PRODUCT_ID: ${{ vars.IAP_REMOVE_ADS_PRODUCT_ID }}
      IAP_AI_ACCESS_PRODUCT_ID: ${{ vars.IAP_AI_ACCESS_PRODUCT_ID }}
      ANDROID_UPLOAD_CERT_SHA256: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify release source is latest master
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master --force
          master_sha="$(git rev-parse origin/master)"
          if [[ "$GITHUB_SHA" != "$master_sha" ]]; then
            echo "::error::Release source $GITHUB_SHA is not latest origin/master $master_sha"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: bash tool/create_platforms.sh

      - name: Apply Android release configuration
        run: bash tool/configure_android_release.sh

      - name: Validate required secrets and variables
        shell: bash
        run: |
          missing=()
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then missing+=("KEYSTORE_BASE64"); fi
          if [ -z "${{ secrets.KEYSTORE_STORE_PASSWORD }}" ]; then missing+=("KEYSTORE_STORE_PASSWORD"); fi
          if [ -z "${{ secrets.KEYSTORE_KEY_ALIAS }}" ]; then missing+=("KEYSTORE_KEY_ALIAS"); fi
          if [ -z "${{ secrets.KEYSTORE_KEY_PASSWORD }}" ]; then missing+=("KEYSTORE_KEY_PASSWORD"); fi
          if [ -z "${{ secrets.ADMOB_APP_ID }}" ]; then missing+=("ADMOB_APP_ID"); fi
          if [ -z "${{ secrets.ADMOB_BANNER_AD_UNIT_ID }}" ]; then missing+=("ADMOB_BANNER_AD_UNIT_ID"); fi
          if [ -z "${{ secrets.GEMINI_PROXY_URL }}" ]; then missing+=("GEMINI_PROXY_URL"); fi
          if [ -z "$IAP_REMOVE_ADS_PRODUCT_ID" ]; then missing+=("IAP_REMOVE_ADS_PRODUCT_ID variable"); fi
          if [ -z "$IAP_AI_ACCESS_PRODUCT_ID" ]; then missing+=("IAP_AI_ACCESS_PRODUCT_ID variable"); fi
          if [ -z "$ANDROID_UPLOAD_CERT_SHA256" ]; then missing+=("ANDROID_UPLOAD_CERT_SHA256 variable"); fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required release configuration: ${missing[*]}"
            exit 1
          fi

      - name: Restore Android upload keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "::add-mask::$KEYSTORE_STORE_PASSWORD"
          echo "::add-mask::$KEYSTORE_KEY_PASSWORD"
          echo "::add-mask::$KEYSTORE_KEY_ALIAS"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF_KEY
          storeFile=app/upload-keystore.jks
          storePassword=$KEYSTORE_STORE_PASSWORD
          keyAlias=$KEYSTORE_KEY_ALIAS
          keyPassword=$KEYSTORE_KEY_PASSWORD
          EOF_KEY

      - name: Verify upload keystore certificate
        shell: bash
        env:
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          output_dir="build/release-verification"
          certificate_der="$RUNNER_TEMP/upload-certificate.der"
          mkdir -p "$output_dir"
          keytool -exportcert \
            -keystore android/app/upload-keystore.jks \
            -alias "$KEYSTORE_KEY_ALIAS" \
            -storepass "$KEYSTORE_STORE_PASSWORD" \
            -file "$certificate_der"
          actual_fingerprint="$(sha256sum "$certificate_der" | awk '{print $1}')"
          rm -f "$certificate_der"
          python3 tool/verify_android_certificate_fingerprint.py \
            --expected "$ANDROID_UPLOAD_CERT_SHA256" \
            --actual "$actual_fingerprint" \
            --label "upload keystore" \
            --output "$output_dir/upload-keystore-certificate.json"

      - name: Show runner memory and versions
        run: |
          free -h
          df -h
          java -version
          flutter --version

      - name: Build release APK (signed)
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: >
          flutter build apk --release
          --dart-define=ADMOB_BANNER_AD_UNIT_ID=${{ secrets.ADMOB_BANNER_AD_UNIT_ID }}
          --dart-define=IAP_REMOVE_ADS_PRODUCT_ID=${IAP_REMOVE_ADS_PRODUCT_ID}
          --dart-define=IAP_AI_ACCESS_PRODUCT_ID=${IAP_AI_ACCESS_PRODUCT_ID}
          --dart-define=GEMINI_PROXY_URL=${{ secrets.GEMINI_PROXY_URL }}

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          output_dir="build/release-verification"
          mkdir -p "$output_dir"
          apksigner_path="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          if [[ -z "$apksigner_path" ]]; then
            echo "::error::apksigner was not found under ${ANDROID_HOME}/build-tools"
            exit 1
          fi
          "$apksigner_path" verify --verbose --print-certs "$apk" 2>&1 \
            | tee "$output_dir/apk-signature-verification.txt"
          apk_fingerprint="$(sed -n 's/.*certificate SHA-256 digest: //p' "$output_dir/apk-signature-verification.txt" | head -n 1)"
          if [[ -z "$apk_fingerprint" ]]; then
            echo "::error::APK signer SHA-256 fingerprint was not found"
            exit 1
          fi
          python3 tool/verify_android_certificate_fingerprint.py \
            --expected "$ANDROID_UPLOAD_CERT_SHA256" \
            --actual "$apk_fingerprint" \
            --label "signed APK" \
            --output "$output_dir/apk-certificate.json"
          sha256sum "$apk" | tee "$output_dir/APK_SHA256SUMS"

      - name: Build release AAB (signed, for Play Console submission)
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: >
          flutter build appbundle --release
          --dart-define=ADMOB_BANNER_AD_UNIT_ID=${{ secrets.ADMOB_BANNER_AD_UNIT_ID }}
          --dart-define=IAP_REMOVE_ADS_PRODUCT_ID=${IAP_REMOVE_ADS_PRODUCT_ID}
          --dart-define=IAP_AI_ACCESS_PRODUCT_ID=${IAP_AI_ACCESS_PRODUCT_ID}
          --dart-define=GEMINI_PROXY_URL=${{ secrets.GEMINI_PROXY_URL }}

      - name: Verify signed AAB
        shell: bash
        run: |
          set -euo pipefail
          aab="build/app/outputs/bundle/release/app-release.aab"
          output_dir="build/release-verification"
          mkdir -p "$output_dir"
          jarsigner -verify -verbose -certs "$aab" 2>&1 \
            | tee "$output_dir/aab-signature-verification.txt"
          keytool -printcert -jarfile "$aab" 2>&1 \
            | tee "$output_dir/aab-signer-certificate.txt"
          aab_fingerprint="$(sed -n 's/^[[:space:]]*SHA256: //p' "$output_dir/aab-signer-certificate.txt" | head -n 1)"
          if [[ -z "$aab_fingerprint" ]]; then
            echo "::error::AAB signer SHA-256 fingerprint was not found"
            exit 1
          fi
          python3 tool/verify_android_certificate_fingerprint.py \
            --expected "$ANDROID_UPLOAD_CERT_SHA256" \
            --actual "$aab_fingerprint" \
            --label "signed AAB" \
            --output "$output_dir/aab-certificate.json"
          sha256sum "$aab" | tee "$output_dir/AAB_SHA256SUMS"

      - name: Generate release manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/generate_release_manifest.py \
            --root . \
            --apk build/app/outputs/flutter-apk/app-release.apk \
            --aab build/app/outputs/bundle/release/app-release.aab \
            --apk-sums build/release-verification/APK_SHA256SUMS \
            --aab-sums build/release-verification/AAB_SHA256SUMS \
            --upload-certificate build/release-verification/upload-keystore-certificate.json \
            --apk-certificate build/release-verification/apk-certificate.json \
            --aab-certificate build/release-verification/aab-certificate.json \
            --iap-product-id "$IAP_REMOVE_ADS_PRODUCT_ID" \
            --iap-ai-product-id "$IAP_AI_ACCESS_PRODUCT_ID" \
            --output build/release-verification/release-manifest.json

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ashita-motsumono-signed-release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/release-verification/upload-keystore-certificate.json
            build/release-verification/apk-signature-verification.txt
            build/release-verification/apk-certificate.json
            build/release-verification/APK_SHA256SUMS
            build/release-verification/release-manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ashita-motsumono-signed-release-aab
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/release-verification/upload-keystore-certificate.json
            build/release-verification/aab-signature-verification.txt
            build/release-verification/aab-signer-certificate.txt
            build/release-verification/aab-certificate.json
            build/release-verification/AAB_SHA256SUMS
            build/release-verification/release-manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload release evidence artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ashita-motsumono-release-evidence
          path: build/release-verification/
          if-no-files-found: error
          retention-days: 7
