name: Debug PDF intake analyzer

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pdf-intake
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Apply implementation
        run: |
          ruby -ryaml -e 'print YAML.load_file(".github/workflows/apply-pdf-intake-p0-fixed-v4.yml").dig("jobs", "apply-fixes", "steps")[2]["run"]' > /tmp/apply-v4.sh
          bash /tmp/apply-v4.sh
          flutter pub get
          dart format \
            lib/src/services/document_intake_service.dart \
            lib/src/services/pdf_render_service.dart \
            lib/src/services/image_file_service.dart \
            lib/src/services/receive_share_handler.dart \
            lib/src/repositories/app_database.dart \
            test/app_database_test.dart \
            test/database_schema_migration_test.dart \
            test/document_intake_service_test.dart
      - name: Capture analyzer
        run: |
          set +e
          flutter analyze --no-fatal-infos > /tmp/analyze.log 2>&1
          status=$?
          echo "analyze_status=$status" > /tmp/analyze-diagnostic.log
          cat /tmp/analyze.log >> /tmp/analyze-diagnostic.log
          cat /tmp/analyze-diagnostic.log
      - name: Commit diagnostic
        if: always()
        run: |
          git reset --hard HEAD
          cp /tmp/analyze-diagnostic.log .github/pdf-intake-analyze-debug.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/pdf-intake-analyze-debug.log
          git commit -m "chore: record PDF intake analyzer failure"
          git push origin HEAD:feature/pdf-intake
