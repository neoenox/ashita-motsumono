name: Apply Settings Test Scroll Fixes

on:
  push:
    branches:
      - agent/full-source-hardening
    paths:
      - .github/workflows/apply-settings-test-scroll-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/full-source-hardening
          fetch-depth: 0

      - name: Update settings widget tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('test/widget_test.dart')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  "expect(find.text('朝 当日 07:00'), findsOneWidget);\n      expect(find.text('サポーター'), findsOneWidget);",
                  "expect(find.text('朝 当日 07:00'), findsOneWidget);\n      await tester.scrollUntilVisible(\n        find.text('サポーター'),\n        300,\n        scrollable: find.byType(Scrollable).first,\n      );\n      await tester.pumpAndSettle();\n      expect(find.text('サポーター'), findsOneWidget);",
              ),
              (
                  "await _openSettings(tester);\n\n      expect(find.text('買い切りサポーター'), findsOneWidget);",
                  "await _openSettings(tester);\n      await tester.scrollUntilVisible(\n        find.text('買い切りサポーター'),\n        300,\n        scrollable: find.byType(Scrollable).first,\n      );\n      await tester.pumpAndSettle();\n\n      expect(find.text('買い切りサポーター'), findsOneWidget);",
              ),
              (
                  "await _openSettings(tester);\n\n      expect(find.text('購入アイテムを準備中です。しばらくしてからもう一度お試しください。'), findsOneWidget);",
                  "await _openSettings(tester);\n      await tester.scrollUntilVisible(\n        find.text('購入アイテムを準備中です。しばらくしてからもう一度お試しください。'),\n        300,\n        scrollable: find.byType(Scrollable).first,\n      );\n      await tester.pumpAndSettle();\n\n      expect(find.text('購入アイテムを準備中です。しばらくしてからもう一度お試しください。'), findsOneWidget);",
              ),
              (
                  "await _openSettings(tester);\n\n      expect(find.text('サポーター登録済み'), findsOneWidget);",
                  "await _openSettings(tester);\n      await tester.scrollUntilVisible(\n        find.text('サポーター登録済み'),\n        300,\n        scrollable: find.byType(Scrollable).first,\n      );\n      await tester.pumpAndSettle();\n\n      expect(find.text('サポーター登録済み'), findsOneWidget);",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, found {count}: {old!r}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/apply-settings-test-scroll-fixes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test/widget_test.dart .github/workflows/apply-settings-test-scroll-fixes.yml
          git commit -m "test: scroll settings content before asserting lower sections"
          git push origin HEAD:agent/full-source-hardening
