name: Apply displayed version synchronization

on:
  push:
    branches:
      - agent/sync-displayed-version

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/sync-displayed-version
          fetch-depth: 0

      - name: Apply version synchronization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          pubspec_path = Path('pubspec.yaml')
          pubspec = pubspec_path.read_text(encoding='utf-8')
          match = re.search(r'^version:\s*([^\s#]+)', pubspec, flags=re.MULTILINE)
          if match is None:
              raise SystemExit('pubspec.yaml version was not found')
          version = match.group(1)

          generated_path = Path('lib/src/app_version.g.dart')
          generated_path.write_text(
              "// GENERATED FILE. Run `python3 tool/sync_app_version.py --write` after changing pubspec.yaml.\n"
              "// Do not edit this file manually.\n\n"
              f"const appVersion = '{version}';\n",
              encoding='utf-8',
          )

          settings_path = Path('lib/src/screens/settings_screen.dart')
          settings = settings_path.read_text(encoding='utf-8')
          import_line = "import '../app_version.g.dart';"
          if import_line not in settings:
              settings = settings.replace(
                  "import '../app_state.dart';",
                  "import '../app_state.dart';\n" + import_line,
                  1,
              )
          updated, count = re.subn(
              r"'Version\s+[^']+'",
              "'Version $appVersion'",
              settings,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'expected one displayed version literal, found {count}')
          settings_path.write_text(updated, encoding='utf-8')

          sync_script = '''#!/usr/bin/env python3
          """Keep the generated in-app version constant synchronized with pubspec.yaml."""

          from __future__ import annotations

          import argparse
          from pathlib import Path
          import re
          import sys

          ROOT = Path(__file__).resolve().parents[1]
          PUBSPEC = ROOT / "pubspec.yaml"
          GENERATED = ROOT / "lib/src/app_version.g.dart"


          def read_version() -> str:
              text = PUBSPEC.read_text(encoding="utf-8")
              match = re.search(r"^version:\\s*([^\\s#]+)", text, flags=re.MULTILINE)
              if match is None:
                  raise RuntimeError("pubspec.yaml version was not found")
              return match.group(1)


          def render(version: str) -> str:
              return (
                  "// GENERATED FILE. Run `python3 tool/sync_app_version.py --write` "
                  "after changing pubspec.yaml.\\n"
                  "// Do not edit this file manually.\\n\\n"
                  f"const appVersion = '{version}';\\n"
              )


          def main() -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument(
                  "--write",
                  action="store_true",
                  help="rewrite the generated Dart file instead of checking it",
              )
              args = parser.parse_args()

              expected = render(read_version())
              if args.write:
                  GENERATED.write_text(expected, encoding="utf-8")
                  return 0

              actual = GENERATED.read_text(encoding="utf-8") if GENERATED.exists() else ""
              if actual != expected:
                  print(
                      "Displayed app version is out of sync. "
                      "Run: python3 tool/sync_app_version.py --write",
                      file=sys.stderr,
                  )
                  return 1
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          '''
          sync_script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in sync_script.splitlines()
          ) + '\n'
          script_path = Path('tool/sync_app_version.py')
          script_path.write_text(sync_script, encoding='utf-8')
          script_path.chmod(0o755)

          ci_path = Path('.github/workflows/ci.yml')
          ci = ci_path.read_text(encoding='utf-8')
          version_step = '''
                - name: Verify displayed app version
                  run: python3 tool/sync_app_version.py
          '''
          version_step = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in version_step.splitlines()
          )
          if 'Verify displayed app version' not in ci:
              marker = "      - name: Verify Android notification manifest\n"
              if marker not in ci:
                  raise SystemExit('CI insertion point was not found')
              ci = ci.replace(marker, version_step.lstrip('\n') + '\n' + marker, 1)
              ci_path.write_text(ci, encoding='utf-8')

          todo_path = Path('docs/TODO.md')
          todo = todo_path.read_text(encoding='utf-8')
          todo_item = '- [x] 設定画面のバージョン表示を`pubspec.yaml`から生成し、CIで同期を検証する。\n'
          if todo_item not in todo:
              marker = '## v0.7以降の候補\n'
              if marker not in todo:
                  raise SystemExit('TODO insertion point was not found')
              todo = todo.replace(marker, todo_item + '\n' + marker, 1)
              todo_path.write_text(todo, encoding='utf-8')

          checklist_path = Path('docs/PLAY_CONSOLE_SUBMISSION.md')
          checklist = checklist_path.read_text(encoding='utf-8')
          checklist_item = '- [x] 設定画面の表示バージョンが`pubspec.yaml`と一致することをCIで確認する\n'
          if checklist_item not in checklist:
              marker = '- [ ] Android実機でカメラ撮影、画像選択、日本語OCR、通知許可、通知予約を確認する\n'
              if marker not in checklist:
                  raise SystemExit('Play checklist insertion point was not found')
              checklist = checklist.replace(marker, checklist_item + marker, 1)
              checklist_path.write_text(checklist, encoding='utf-8')
          PY

          rm .github/workflows/apply-version-sync.yml
          python3 tool/sync_app_version.py
          git diff --check

      - name: Commit synchronized version handling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/ci.yml docs/PLAY_CONSOLE_SUBMISSION.md docs/TODO.md lib/src/app_version.g.dart lib/src/screens/settings_screen.dart tool/sync_app_version.py .github/workflows/apply-version-sync.yml
          git commit -m "fix: sync displayed version with pubspec"
          git push origin HEAD:agent/sync-displayed-version
