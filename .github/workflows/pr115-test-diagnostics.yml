name: PR 115 test diagnostics

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  capture-flutter-test-log:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter tests and capture output
        id: flutter-tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee flutter-test.log

      - name: Upload Flutter test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr115-flutter-test-log
          path: flutter-test.log
          if-no-files-found: error
          retention-days: 1

      - name: Preserve test failure status
        if: steps.flutter-tests.outcome == 'failure'
        run: exit 1
