name: Release Readiness Preflight

on:
  pull_request:
    paths:
      - 'pubspec.yaml'
      - 'lib/src/app_version.g.dart'
      - 'docs/STORE_LISTING_JA.md'
      - 'docs/RELEASE_NOTES_V070_JA.md'
      - 'docs/PLAY_CONSOLE_SUBMISSION.md'
      - 'docs/ANDROID_RELEASE.md'
      - 'docs/RELEASE_EXECUTION_PLAN.md'
      - 'assets/store/**'
      - 'tool/release_readiness_preflight.py'
      - 'tool/test_release_readiness_preflight.py'
      - 'tool/play_state_preflight.py'
      - 'tool/test_play_state_preflight.py'
      - 'fastlane/Fastfile'
      - 'test/release_readiness_preflight_tool_test.dart'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release-readiness-preflight.yml'
  push:
    branches: [master]
    paths:
      - 'pubspec.yaml'
      - 'lib/src/app_version.g.dart'
      - 'docs/STORE_LISTING_JA.md'
      - 'docs/RELEASE_NOTES_V070_JA.md'
      - 'docs/PLAY_CONSOLE_SUBMISSION.md'
      - 'docs/ANDROID_RELEASE.md'
      - 'docs/RELEASE_EXECUTION_PLAN.md'
      - 'assets/store/**'
      - 'tool/release_readiness_preflight.py'
      - 'tool/test_release_readiness_preflight.py'
      - 'tool/play_state_preflight.py'
      - 'tool/test_play_state_preflight.py'
      - 'fastlane/Fastfile'
      - 'test/release_readiness_preflight_tool_test.dart'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release-readiness-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-readiness:
    name: Static release readiness
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Run preflight unit tests
        run: python3 -m unittest tool/test_release_readiness_preflight.py

      - name: Validate release candidate
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo "::error::pubspec.yaml version has unexpected format: $version"
            exit 1
          fi
          python3 tool/release_readiness_preflight.py \
            --root . \
            --expected-version-prefix "${version%+*}+" \
            --output build/release-readiness/static-preflight.json

      - name: Upload static preflight evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-readiness-static-${{ github.sha }}
          path: build/release-readiness/static-preflight.json
          if-no-files-found: error
          retention-days: 7

  configuration-presence:
    name: Release configuration presence
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' }}
    needs: static-readiness
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Check required setting names without exposing values
        env:
          HAS_SECRET_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 != '' }}
          HAS_SECRET_KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD != '' }}
          HAS_SECRET_KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD != '' }}
          HAS_SECRET_KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS != '' }}
          HAS_SECRET_ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID != '' }}
          HAS_SECRET_ADMOB_BANNER_AD_UNIT_ID: ${{ secrets.ADMOB_BANNER_AD_UNIT_ID != '' }}
          HAS_SECRET_GEMINI_PROXY_URL: ${{ secrets.GEMINI_PROXY_URL != '' }}
          HAS_VARIABLE_ANDROID_UPLOAD_CERT_SHA256: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 != '' }}
          HAS_VARIABLE_IAP_REMOVE_ADS_PRODUCT_ID: ${{ vars.IAP_REMOVE_ADS_PRODUCT_ID != '' }}
          HAS_VARIABLE_IAP_AI_ACCESS_PRODUCT_ID: ${{ vars.IAP_AI_ACCESS_PRODUCT_ID != '' }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo "::error::pubspec.yaml version has unexpected format: $version"
            exit 1
          fi
          python3 tool/release_readiness_preflight.py \
            --root . \
            --expected-version-prefix "${version%+*}+" \
            --check-configuration \
            --output build/release-readiness/configuration-preflight.json

      - name: Upload configuration preflight evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-readiness-configuration-${{ github.sha }}
          path: build/release-readiness/configuration-preflight.json
          if-no-files-found: warn
          retention-days: 7

  play-state-preflight:
    name: Google Play state preflight (used versionCode)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    needs: static-readiness
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Restore Google Play credential
        shell: bash
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not available on this run (fork PR?)."
            exit 1
          fi
          credential="$RUNNER_TEMP/play-service-account.json"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$credential"
          chmod 600 "$credential"
          python3 -m json.tool "$credential" >/dev/null
          echo "PLAY_SERVICE_ACCOUNT_JSON_PATH=$credential" >> "$GITHUB_ENV"

      - name: Fetch used versionCodes from Google Play
        shell: bash
        run: bundle exec fastlane android play_preflight

      - name: Evaluate versionCode availability
        shell: bash
        run: >-
          python3 tool/play_state_preflight.py
          --used-codes build/play-release/used-version-codes.json
          --output build/play-release/play-state-preflight.json

      - name: Upload play state preflight evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-readiness-play-state-${{ github.sha }}
          path: build/play-release/play-state-preflight.json
          if-no-files-found: warn
          retention-days: 7
