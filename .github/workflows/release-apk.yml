name: Release Android

# Manual-only until this pipeline converges with the Play pipeline
# (release-android.yml): v* tag pushes are intentionally disabled.
on:
  workflow_dispatch:

jobs:
  build-android:
    name: Build signed Android release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: bash tool/create_platforms.sh

      - name: Apply Android release configuration
        run: bash tool/configure_android_release.sh

      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_AD_UNIT_ID: ${{ secrets.ADMOB_BANNER_AD_UNIT_ID }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing KEYSTORE_BASE64 secret" >&2; exit 1)
          test -n "$KEYSTORE_STORE_PASSWORD" || (echo "Missing KEYSTORE_STORE_PASSWORD secret" >&2; exit 1)
          test -n "$KEYSTORE_KEY_PASSWORD" || (echo "Missing KEYSTORE_KEY_PASSWORD secret" >&2; exit 1)
          test -n "$KEYSTORE_KEY_ALIAS" || (echo "Missing KEYSTORE_KEY_ALIAS secret" >&2; exit 1)
          test -n "$ADMOB_APP_ID" || (echo "Missing ADMOB_APP_ID secret" >&2; exit 1)
          test -n "$ADMOB_BANNER_AD_UNIT_ID" || (echo "Missing ADMOB_BANNER_AD_UNIT_ID secret" >&2; exit 1)

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/app/keystore.jks

      - name: Set signing environment variables
        run: |
          echo "KEYSTORE_PATH=app/keystore.jks" >> $GITHUB_ENV
          echo "KEYSTORE_STORE_PASSWORD=${{ secrets.KEYSTORE_STORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEYSTORE_KEY_PASSWORD=${{ secrets.KEYSTORE_KEY_PASSWORD }}" >> $GITHUB_ENV
          echo "KEYSTORE_KEY_ALIAS=${{ secrets.KEYSTORE_KEY_ALIAS }}" >> $GITHUB_ENV

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build APK
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID || '' }}
        run: >
          flutter build apk --release
          --dart-define=ADMOB_BANNER_AD_UNIT_ID=${{ secrets.ADMOB_BANNER_AD_UNIT_ID || '' }}
          --dart-define=IAP_REMOVE_ADS_PRODUCT_ID=${{ vars.IAP_REMOVE_ADS_PRODUCT_ID || 'remove_ads' }}

      - name: Build App Bundle
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID || '' }}
        run: >
          flutter build appbundle --release
          --dart-define=ADMOB_BANNER_AD_UNIT_ID=${{ secrets.ADMOB_BANNER_AD_UNIT_ID || '' }}
          --dart-define=IAP_REMOVE_ADS_PRODUCT_ID=${{ vars.IAP_REMOVE_ADS_PRODUCT_ID || 'remove_ads' }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ashita-motsumono-${{ github.ref_name }}-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ashita-motsumono-${{ github.ref_name }}-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: true
          name: ${{ github.ref_name }}
