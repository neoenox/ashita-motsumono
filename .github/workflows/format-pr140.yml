name: Format PR 140 files

on:
  push:
    branches: [feature/review-extraction-improvements]

permissions:
  contents: write

concurrency:
  group: format-pr140
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/review-extraction-improvements
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
      - run: |
          dart format \
            lib/src/models/bulk_extraction_review_state.dart \
            lib/src/screens/review_extractions_screen.dart \
            test/bulk_extraction_review_state_test.dart
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            lib/src/models/bulk_extraction_review_state.dart \
            lib/src/screens/review_extractions_screen.dart \
            test/bulk_extraction_review_state_test.dart
          git commit -m 'style: apply dart format to review improvements'
          git push origin HEAD:feature/review-extraction-improvements
