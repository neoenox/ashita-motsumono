name: Apply PDF intake P0 fixes

on:
  push:
    branches:
      - feature/pdf-intake

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pdf-intake
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Apply fixes and regression tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}: {old[:120]!r}')
              target.write_text(text.replace(old, new, 1))

          Path('lib/src/services/document_intake_service.dart').write_text(r'''// lib/src/services/document_intake_service.dart
          // 画像・PDF・共有テキストの取り込みパイプラインを統一的に処理する。
          // ファイル選択 → コピー → OCR → 候補抽出 → 永続化 を一貫して行う。
          // 関連: pdf_render_service.dart, ocr_service.dart, extraction_service.dart, app_state.dart

          import 'dart:io';

          import 'package:crypto/crypto.dart';
          import 'package:flutter/foundation.dart';
          import 'package:path/path.dart' as p;
          import 'package:path_provider/path_provider.dart';
          import 'package:uuid/uuid.dart';

          import '../app_state.dart';
          import '../models/entities.dart';
          import 'app_settings.dart';
          import 'extraction_service.dart';
          import 'image_file_service.dart';
          import 'ocr_service.dart';
          import 'pdf_render_service.dart';

          sealed class IntakeResult {
            const IntakeResult();
          }

          final class IntakeSuccess extends IntakeResult {
            const IntakeSuccess({
              required this.document,
              required this.drafts,
            });

            final DocumentRecord document;
            final List<ExtractionDraft> drafts;
          }

          final class IntakeDuplicate extends IntakeResult {
            const IntakeDuplicate({required this.existingDocumentId});

            final String existingDocumentId;
          }

          final class IntakeNoCandidates extends IntakeResult {
            IntakeNoCandidates({
              required this.document,
              required this.ocrText,
              required List<PageOcrResult> pageResults,
            }) : pageResults = List<PageOcrResult>.unmodifiable(pageResults);

            final DocumentRecord document;
            final String ocrText;
            final List<PageOcrResult> pageResults;
          }

          final class IntakeEmpty extends IntakeResult {
            const IntakeEmpty();
          }

          final class IntakeError extends IntakeResult {
            const IntakeError(this.message);

            final String message;
          }

          class DocumentIntakeService {
            DocumentIntakeService({
              required AppState appState,
              required AppSettings appSettings,
              OcrService? ocrService,
              PdfRenderService? pdfRenderService,
              ImageFileService? imageFileService,
              Future<Directory> Function()? temporaryDirectoryProvider,
              Future<Directory> Function()? documentsDirectoryProvider,
            }) : _appState = appState,
                 _appSettings = appSettings,
                 _ocrService = ocrService ?? OcrService(),
                 _pdfRenderService = pdfRenderService ?? PdfRenderService(),
                 _imageFileService = imageFileService ?? ImageFileService(),
                 _temporaryDirectoryProvider =
                     temporaryDirectoryProvider ?? getTemporaryDirectory,
                 _documentsDirectoryProvider =
                     documentsDirectoryProvider ?? getApplicationDocumentsDirectory;

            final AppState _appState;
            final AppSettings _appSettings;
            final OcrService _ocrService;
            final PdfRenderService _pdfRenderService;
            final ImageFileService _imageFileService;
            final Future<Directory> Function() _temporaryDirectoryProvider;
            final Future<Directory> Function() _documentsDirectoryProvider;

            Future<IntakeResult> importPdf({
              required String sourcePath,
              required String sourceType,
              void Function(int current, int total)? onProgress,
            }) async {
              try {
                return await _runWithStaging((staging) async {
                  final pdfFile = await _copyToStaging(File(sourcePath), staging);
                  final fileHash = await _sha256(pdfFile);
                  if (fileHash == null) {
                    return const IntakeError('PDFファイルを読み込めませんでした。');
                  }

                  final existing = _findDocumentByFingerprint(fileHash);
                  if (existing != null) {
                    return IntakeDuplicate(existingDocumentId: existing.id);
                  }

                  final renderedPages = await _pdfRenderService.render(
                    pdfFile: pdfFile,
                    stagingDirectory: staging,
                    onProgress: onProgress,
                  );
                  final pageResults = await _recognizePages(renderedPages);
                  final combinedText = _combinePageText(
                    pageResults,
                    unitLabel: 'ページ',
                  );
                  final drafts = _extractDrafts(combinedText);

                  final duplicateBeforeSave = _findDocumentByFingerprint(fileHash);
                  if (duplicateBeforeSave != null) {
                    return IntakeDuplicate(
                      existingDocumentId: duplicateBeforeSave.id,
                    );
                  }

                  final document = await _saveDocumentWithPages(
                    sourceType: sourceType,
                    sourceMimeType: 'application/pdf',
                    sourceFingerprint: fileHash,
                    ocrText: combinedText,
                    pageResults: pageResults,
                  );

                  if (drafts.isEmpty) {
                    return IntakeNoCandidates(
                      document: document,
                      ocrText: combinedText,
                      pageResults: _pageResultsFromDocument(document),
                    );
                  }

                  return IntakeSuccess(document: document, drafts: drafts);
                });
              } on PdfImportException catch (error) {
                return IntakeError(error.message);
              } on Object catch (error, stackTrace) {
                _debugLog('PDF import failed', error, stackTrace);
                return const IntakeError('PDFの取り込みに失敗しました。');
              }
            }

            Future<IntakeResult> importImages({
              required List<String> sourcePaths,
              required String sourceType,
            }) async {
              if (sourcePaths.isEmpty) {
                return const IntakeError('画像を読み込めませんでした。');
              }

              try {
                return await _runWithStaging((staging) async {
                  final copiedImages = <File>[];
                  for (final path in sourcePaths) {
                    final copied = await _imageFileService.copyFromPath(
                      path,
                      destinationDirectory: staging,
                    );
                    copiedImages.add(copied);
                  }

                  final pageResults = <PageOcrResult>[];
                  for (var i = 0; i < copiedImages.length; i++) {
                    final text = await _ocrService.recognize(copiedImages[i]);
                    pageResults.add(
                      PageOcrResult(
                        pageIndex: i,
                        imageFile: copiedImages[i],
                        text: text.trim(),
                      ),
                    );
                  }

                  final combinedText = _combinePageText(
                    pageResults,
                    unitLabel: '枚目',
                  );
                  final drafts = _extractDrafts(combinedText);
                  final document = await _saveDocumentWithPages(
                    sourceType: sourceType,
                    sourceMimeType: 'image/*',
                    ocrText: combinedText,
                    pageResults: pageResults,
                  );

                  if (drafts.isEmpty) {
                    return IntakeNoCandidates(
                      document: document,
                      ocrText: combinedText,
                      pageResults: _pageResultsFromDocument(document),
                    );
                  }

                  return IntakeSuccess(document: document, drafts: drafts);
                });
              } on Object catch (error, stackTrace) {
                _debugLog('Image import failed', error, stackTrace);
                return const IntakeError('画像の取り込みに失敗しました。');
              }
            }

            Future<IntakeResult> importText({
              required String text,
              required String sourceType,
            }) async {
              final trimmed = text.trim();
              if (trimmed.isEmpty) {
                return const IntakeError('共有されたテキストが空です。');
              }

              final drafts = _extractDrafts(trimmed);
              try {
                final document = await _appState.addDocument(
                  sourceType: sourceType,
                  ocrText: trimmed,
                );
                if (drafts.isEmpty) {
                  return IntakeNoCandidates(
                    document: document,
                    ocrText: trimmed,
                    pageResults: const [],
                  );
                }
                return IntakeSuccess(document: document, drafts: drafts);
              } on Object catch (error, stackTrace) {
                _debugLog('Text import failed', error, stackTrace);
                return const IntakeError('テキストの保存に失敗しました。');
              }
            }

            Future<List<PageOcrResult>> _recognizePages(
              List<RenderedPdfPage> renderedPages,
            ) async {
              final pageResults = <PageOcrResult>[];
              for (final page in renderedPages) {
                final text = await _ocrService.recognize(page.imageFile);
                pageResults.add(
                  PageOcrResult(
                    pageIndex: page.pageIndex,
                    imageFile: page.imageFile,
                    text: text.trim(),
                  ),
                );
              }
              return pageResults;
            }

            List<ExtractionDraft> _extractDrafts(String text) {
              if (text.trim().isEmpty) return const <ExtractionDraft>[];
              return ExtractionService.extractMany(
                text,
                learnedItemLabels: _appSettings.learnedItemLabels,
              );
            }

            String _combinePageText(
              List<PageOcrResult> pageResults, {
              required String unitLabel,
            }) {
              return pageResults
                  .where((result) => result.text.isNotEmpty)
                  .map(
                    (result) =>
                        '--- ${result.pageIndex + 1}$unitLabel ---\n${result.text}',
                  )
                  .join('\n\n');
            }

            DocumentRecord? _findDocumentByFingerprint(String fingerprint) {
              for (final document in _appState.documents) {
                if (document.sourceFingerprint == fingerprint) return document;
              }
              return null;
            }

            Future<DocumentRecord> _saveDocumentWithPages({
              required String sourceType,
              required String ocrText,
              required List<PageOcrResult> pageResults,
              String? sourceMimeType,
              String? sourceFingerprint,
            }) async {
              if (pageResults.isEmpty) {
                throw StateError('保存対象のページがありません。');
              }

              final imagesDir = await _createImagesDirectory();
              final documentId = const Uuid().v4();
              final now = DateTime.now();
              final pages = <DocumentPageRecord>[];
              final persistedPaths = <String>[];

              try {
                for (final pageResult in pageResults) {
                  final extension = _supportedExtension(pageResult.imageFile.path);
                  final destPath = p.join(
                    imagesDir.path,
                    '${documentId}_page_${pageResult.pageIndex.toString().padLeft(3, '0')}$extension',
                  );
                  await pageResult.imageFile.copy(destPath);
                  persistedPaths.add(destPath);

                  pages.add(
                    DocumentPageRecord(
                      id: '${documentId}_p${pageResult.pageIndex}',
                      documentId: documentId,
                      pageIndex: pageResult.pageIndex,
                      localImagePath: destPath,
                      ocrText: pageResult.text,
                    ),
                  );
                }

                final document = DocumentRecord(
                  id: documentId,
                  sourceType: sourceType,
                  localImagePath: pages.first.localImagePath,
                  ocrText: ocrText,
                  sourceMimeType: sourceMimeType,
                  sourceFingerprint: sourceFingerprint,
                  createdAt: now,
                  updatedAt: now,
                  pages: pages,
                );

                await _appState.addDocumentRecord(document);
                return document;
              } on Object catch (error, stackTrace) {
                for (final path in persistedPaths.reversed) {
                  await ImageFileService.deleteIfExists(path);
                }
                Error.throwWithStackTrace(error, stackTrace);
              }
            }

            List<PageOcrResult> _pageResultsFromDocument(DocumentRecord document) {
              final pages = [...document.pages]
                ..sort((a, b) => a.pageIndex.compareTo(b.pageIndex));
              return pages
                  .map(
                    (page) => PageOcrResult(
                      pageIndex: page.pageIndex,
                      imageFile: File(page.localImagePath),
                      text: page.ocrText,
                    ),
                  )
                  .toList(growable: false);
            }

            String _supportedExtension(String path) {
              return switch (p.extension(path).toLowerCase()) {
                '.png' || '.jpg' || '.jpeg' || '.webp' =>
                  p.extension(path).toLowerCase(),
                _ => '.jpg',
              };
            }

            Future<File> _copyToStaging(File source, Directory staging) async {
              await staging.create(recursive: true);
              final extension = p.extension(source.path);
              final dest = File(p.join(staging.path, '${const Uuid().v4()}$extension'));
              await source.copy(dest.path);
              return dest;
            }

            Future<String?> _sha256(File file) async {
              try {
                final bytes = await file.readAsBytes();
                return sha256.convert(bytes).toString();
              } on Object {
                return null;
              }
            }

            Future<Directory> _createImagesDirectory() async {
              final appDir = await _documentsDirectoryProvider();
              final imagesDir = Directory(p.join(appDir.path, 'document_images'));
              await imagesDir.create(recursive: true);
              return imagesDir;
            }

            Future<T> _runWithStaging<T>(
              Future<T> Function(Directory staging) action,
            ) async {
              final root = await _temporaryDirectoryProvider();
              final staging = Directory(
                p.join(root.path, 'intake_${const Uuid().v4()}'),
              );
              await staging.create(recursive: true);

              try {
                return await action(staging);
              } finally {
                if (await staging.exists()) {
                  try {
                    await staging.delete(recursive: true);
                  } on Object catch (error, stackTrace) {
                    _debugLog('Staging cleanup failed', error, stackTrace);
                  }
                }
              }
            }

            void _debugLog(String message, Object error, StackTrace stackTrace) {
              if (kDebugMode) {
                debugPrint('DocumentIntakeService: $message: $error\n$stackTrace');
              }
            }
          }

          final class PageOcrResult {
            const PageOcrResult({
              required this.pageIndex,
              required this.imageFile,
              required this.text,
            });

            final int pageIndex;
            final File imageFile;
            final String text;
          }
          '''.replace('\n          ', '\n').lstrip())

          Path('lib/src/services/pdf_render_service.dart').write_text(r'''// lib/src/services/pdf_render_service.dart
          // PDFファイルを検証し、ページ単位でJPEG画像にレンダリングする。
          // 1ページずつ逐次処理し、メモリ使用量を抑える。
          // 関連: pdf_pick_service.dart, document_intake_service.dart, add_todo_screen.dart

          import 'dart:io';
          import 'dart:math' as math;

          import 'package:flutter/foundation.dart';
          import 'package:path/path.dart' as p;
          import 'package:pdfx/pdfx.dart';
          import 'package:uuid/uuid.dart';

          class PdfImportException implements Exception {
            const PdfImportException(this.message);

            final String message;

            @override
            String toString() => message;
          }

          class RenderedPdfPage {
            const RenderedPdfPage({
              required this.pageIndex,
              required this.imageFile,
            });

            final int pageIndex;
            final File imageFile;
          }

          class PdfImportLimits {
            const PdfImportLimits({
              this.maxBytes = 25 * 1024 * 1024,
              this.maxPages = 20,
              this.maxLongEdge = 2048,
              this.jpegQuality = 90,
              this.retryLongEdge = 1600,
            });

            final int maxBytes;
            final int maxPages;
            final double maxLongEdge;
            final int jpegQuality;
            final double retryLongEdge;
          }

          class PdfRenderService {
            PdfRenderService({PdfImportLimits? limits})
              : _limits = limits ?? const PdfImportLimits();

            final PdfImportLimits _limits;

            Future<List<RenderedPdfPage>> render({
              required File pdfFile,
              required Directory stagingDirectory,
              void Function(int current, int total)? onProgress,
            }) async {
              if (!await pdfFile.exists()) {
                throw const PdfImportException('PDFファイルが見つかりません。');
              }

              final fileSize = await pdfFile.length();
              if (fileSize <= 0) {
                throw const PdfImportException('PDFファイルが空です。');
              }
              if (fileSize > _limits.maxBytes) {
                throw PdfImportException(
                  'PDFは${_formatBytes(_limits.maxBytes)}以下にしてください。',
                );
              }

              try {
                await _validatePdfHeader(pdfFile);
              } on PdfImportException {
                rethrow;
              } on Object catch (error) {
                throw _pdfExceptionFor(error);
              }

              await stagingDirectory.create(recursive: true);
              final document = await _openDocument(pdfFile);
              final renderedPages = <RenderedPdfPage>[];

              try {
                if (document.pagesCount <= 0) {
                  throw const PdfImportException('PDFにページがありません。');
                }
                if (document.pagesCount > _limits.maxPages) {
                  throw PdfImportException(
                    'PDFは${_limits.maxPages}ページ以下にしてください。',
                  );
                }

                for (var pageNumber = 1;
                    pageNumber <= document.pagesCount;
                    pageNumber++) {
                  final page = await _openPage(document, pageNumber);
                  try {
                    final rendered = await _renderPage(
                      page,
                      pageNumber,
                      stagingPath: stagingDirectory.path,
                    );
                    if (rendered == null) {
                      throw PdfImportException(
                        '${pageNumber}ページ目を画像化できませんでした。',
                      );
                    }
                    renderedPages.add(rendered);
                    onProgress?.call(pageNumber, document.pagesCount);
                  } on PdfImportException {
                    rethrow;
                  } on Object catch (error) {
                    throw _pdfExceptionFor(error, pageNumber: pageNumber);
                  } finally {
                    await _closePageSafely(page);
                  }
                }

                return renderedPages;
              } finally {
                await _closeDocumentSafely(document);
              }
            }

            Future<PdfDocument> _openDocument(File pdfFile) async {
              try {
                return await PdfDocument.openFile(pdfFile.path);
              } on Object catch (error) {
                throw _pdfExceptionFor(error);
              }
            }

            Future<PdfPage> _openPage(PdfDocument document, int pageNumber) async {
              try {
                return await document.getPage(pageNumber);
              } on Object catch (error) {
                throw _pdfExceptionFor(error, pageNumber: pageNumber);
              }
            }

            Future<RenderedPdfPage?> _renderPage(
              PdfPage page,
              int pageNumber, {
              required String stagingPath,
            }) async {
              final width = page.width;
              final height = page.height;
              if (!width.isFinite ||
                  !height.isFinite ||
                  width <= 0 ||
                  height <= 0) {
                throw PdfImportException(
                  '${pageNumber}ページ目のサイズ情報が不正です。',
                );
              }

              final first = await _renderAtLongEdge(page, _limits.maxLongEdge);
              if (first != null && first.isNotEmpty) {
                return _savePageImage(
                  first,
                  pageNumber,
                  stagingDirectoryPath: stagingPath,
                );
              }

              final retry = await _renderAtLongEdge(page, _limits.retryLongEdge);
              if (retry == null || retry.isEmpty) return null;
              return _savePageImage(
                retry,
                pageNumber,
                stagingDirectoryPath: stagingPath,
              );
            }

            Future<Uint8List?> _renderAtLongEdge(
              PdfPage page,
              double targetLongEdge,
            ) async {
              if (!targetLongEdge.isFinite || targetLongEdge <= 0) return null;
              final longEdge = math.max(page.width, page.height);
              if (!longEdge.isFinite || longEdge <= 0) return null;
              final scale = targetLongEdge / longEdge;
              final renderWidth = math.max(1, (page.width * scale).ceil()).toDouble();
              final renderHeight = math.max(1, (page.height * scale).ceil()).toDouble();

              try {
                final rendered = await page.render(
                  width: renderWidth,
                  height: renderHeight,
                  format: PdfPageImageFormat.jpeg,
                  backgroundColor: '#FFFFFF',
                  quality: _limits.jpegQuality,
                );
                return rendered?.bytes;
              } on Object {
                return null;
              }
            }

            Future<RenderedPdfPage> _savePageImage(
              Uint8List bytes,
              int pageNumber, {
              required String stagingDirectoryPath,
            }) async {
              final output = File(
                p.join(
                  stagingDirectoryPath,
                  'pdf_page_${pageNumber.toString().padLeft(3, '0')}_${const Uuid().v4()}.jpg',
                ),
              );
              await output.writeAsBytes(bytes, flush: true);
              return RenderedPdfPage(pageIndex: pageNumber - 1, imageFile: output);
            }

            Future<void> _validatePdfHeader(File file) async {
              final handle = await file.open();
              try {
                final header = await handle.read(5);
                final valid =
                    header.length == 5 &&
                    header[0] == 0x25 &&
                    header[1] == 0x50 &&
                    header[2] == 0x44 &&
                    header[3] == 0x46 &&
                    header[4] == 0x2D;
                if (!valid) {
                  throw const PdfImportException(
                    '選択されたファイルは有効なPDFではありません。',
                  );
                }
              } finally {
                await handle.close();
              }
            }

            PdfImportException _pdfExceptionFor(
              Object error, {
              int? pageNumber,
            }) {
              if (error is PdfImportException) return error;
              final raw = error.toString().toLowerCase();
              if (raw.contains('password') ||
                  raw.contains('encrypted') ||
                  raw.contains('encryption') ||
                  raw.contains('security handler')) {
                return const PdfImportException(
                  '暗号化されたPDFには対応していません。暗号化を解除してから選択してください。',
                );
              }
              if (pageNumber != null) {
                return PdfImportException(
                  '${pageNumber}ページ目を読み込めませんでした。PDFが破損していないか確認してください。',
                );
              }
              return const PdfImportException(
                'PDFを開けませんでした。ファイルが破損していないか確認してください。',
              );
            }

            Future<void> _closePageSafely(PdfPage page) async {
              try {
                await page.close();
              } on Object catch (error, stackTrace) {
                if (kDebugMode) {
                  debugPrint('PdfRenderService: page close failed: $error\n$stackTrace');
                }
              }
            }

            Future<void> _closeDocumentSafely(PdfDocument document) async {
              try {
                await document.close();
              } on Object catch (error, stackTrace) {
                if (kDebugMode) {
                  debugPrint(
                    'PdfRenderService: document close failed: $error\n$stackTrace',
                  );
                }
              }
            }

            String _formatBytes(int bytes) {
              if (bytes >= 1024 * 1024) {
                return '${bytes ~/ (1024 * 1024)}MB';
              }
              return '${bytes ~/ 1024}KB';
            }
          }
          '''.replace('\n          ', '\n').lstrip())

          Path('lib/src/services/image_file_service.dart').write_text(r'''import 'dart:io';

          import 'package:flutter/foundation.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:path/path.dart' as p;
          import 'package:path_provider/path_provider.dart';
          import 'package:uuid/uuid.dart';

          class ImageFileService {
            ImageFileService({Uuid? uuid}) : _uuid = uuid ?? const Uuid();

            static const maxImageBytes = 5 * 1024 * 1024;

            final Uuid _uuid;

            Future<File> copyFromXFile(XFile source) async {
              final sourceLength = await source.length();
              if (sourceLength <= 0) throw StateError('画像ファイルが空です。');
              if (sourceLength > maxImageBytes) {
                throw StateError('画像サイズが5MBを超えています。');
              }
              final imageDir = await _documentImagesDirectory();
              final rawExtension = p.extension(source.path).toLowerCase();
              final extension = _normalizedExtension(rawExtension);
              final dest = File(p.join(imageDir.path, '${_uuid.v4()}$extension'));
              final bytes = await source.readAsBytes();
              if (bytes.isEmpty) throw StateError('画像ファイルが空です。');
              if (bytes.length > maxImageBytes) {
                throw StateError('画像サイズが5MBを超えています。');
              }
              await dest.writeAsBytes(bytes, flush: true);
              return dest;
            }

            Future<File> copyFromPath(
              String sourcePath, {
              Directory? destinationDirectory,
            }) async {
              final source = File(sourcePath);
              final sourceLength = await source.length();
              if (sourceLength <= 0) throw StateError('画像ファイルが空です。');
              if (sourceLength > maxImageBytes) {
                throw StateError('画像サイズが5MBを超えています。');
              }
              final imageDir =
                  destinationDirectory ?? await _documentImagesDirectory();
              await imageDir.create(recursive: true);
              final extension = _normalizedExtension(
                p.extension(sourcePath).toLowerCase(),
              );
              final dest = File(p.join(imageDir.path, '${_uuid.v4()}$extension'));
              await source.copy(dest.path);
              return dest;
            }

            Future<Directory> _documentImagesDirectory() async {
              final dir = await getApplicationDocumentsDirectory();
              final imageDir = Directory(p.join(dir.path, 'document_images'));
              await imageDir.create(recursive: true);
              return imageDir;
            }

            String _normalizedExtension(String rawExtension) {
              return switch (rawExtension) {
                '.png' || '.jpg' || '.jpeg' || '.webp' => rawExtension,
                _ => '.jpg',
              };
            }

            static Future<void> deleteIfExistsStrict(String path) async {
              if (path.isEmpty) return;
              final file = File(path);
              if (await file.exists()) await file.delete();
            }

            static Future<void> deleteIfExists(String path) async {
              try {
