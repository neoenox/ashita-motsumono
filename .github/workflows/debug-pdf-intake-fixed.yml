name: Debug fixed PDF intake apply

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pdf-intake
          fetch-depth: 0

      - name: Capture corrected implementation output
        shell: bash
        run: |
          set +e
          ruby -ryaml -e 'print YAML.load_file(".github/workflows/apply-pdf-intake-p0.yml").dig("jobs", "apply-fixes", "steps")[2]["run"]' > /tmp/apply-pdf-intake.sh 2> /tmp/extract.log
          extract_status=$?
          cat > /tmp/repair.py <<'PY'
          from pathlib import Path

          path = Path('/tmp/apply-pdf-intake.sh')
          text = path.read_text()
          start_marker = (
              "replace_once(\n"
              "    'lib/src/repositories/app_database.dart',\n"
              "    '''  Future<void> _migrateToV3"
          )
          end_marker = (
              "\n)\n\nreplace_once(\n"
              "    'lib/src/services/receive_share_handler.dart'"
          )
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end]
          block = block.replace(
              "    '''  Future<void> _migrateToV3",
              '    """  Future<void> _migrateToV3',
              1,
          )
          block = block.replace(
              "\n''',\n    '''  Future<void> _migrateToV3",
              '\n""",\n    """  Future<void> _migrateToV3',
              1,
          )
          prefix, suffix = block.rsplit("\n''',\n", 1)
          block = prefix + '\n""",\n' + suffix
          text = text[:start] + block + text[end:]

          schema_start_marker = (
              "Path('test/database_schema_migration_test.dart')"
              ".write_text(r'''"
          )
          schema_start = text.index(schema_start_marker)
          text = text.replace(
              schema_start_marker,
              "Path('test/database_schema_migration_test.dart')"
              '.write_text(r"""',
              1,
          )
          schema_close_marker = "'''.replace('\\n          ', '\\n').lstrip())"
          schema_close = text.index(schema_close_marker, schema_start)
          text = (
              text[:schema_close]
              + '""".replace(\'\\n          \', \'\\n\').lstrip())'
              + text[schema_close + len(schema_close_marker):]
          )
          path.write_text(text)
          PY
          python3 /tmp/repair.py > /tmp/repair.log 2>&1
          repair_status=$?
          if [ "$repair_status" -eq 0 ]; then
            bash -x /tmp/apply-pdf-intake.sh > /tmp/apply.log 2>&1
            apply_status=$?
          else
            apply_status=99
          fi
          {
            echo "extract_status=$extract_status"
            cat /tmp/extract.log
            echo "repair_status=$repair_status"
            cat /tmp/repair.log
            echo "apply_status=$apply_status"
            cat /tmp/apply.log 2>/dev/null
          } > /tmp/diagnostic-fixed.log
          cat /tmp/diagnostic-fixed.log

      - name: Commit diagnostic
        if: always()
        shell: bash
        run: |
          git reset --hard HEAD
          cp /tmp/diagnostic-fixed.log .github/pdf-intake-fixed-debug.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/pdf-intake-fixed-debug.log
          git commit -m "chore: record fixed PDF intake failure"
          git push origin HEAD:feature/pdf-intake
