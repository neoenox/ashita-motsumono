name: Repair widget test setup

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: repair-widget-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repair-widget-test:
    if: github.head_ref == 'fix/v0.6.3-release-gate'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Prevent the first HomeScreen test from opening notification dialog
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('test/widget_test.dart')
          text = path.read_text(encoding='utf-8')
          before = "SharedPreferences.setMockInitialValues({'onboarding_completed_v1': true});"
          after = """SharedPreferences.setMockInitialValues({
            'onboarding_completed_v1': true,
            'notification_info_shown_v1': true,
          });"""
          if before not in text:
              raise SystemExit('expected widget test setup was not found')
          path.write_text(text.replace(before, after, 1), encoding='utf-8')
          PY

      - name: Remove temporary diagnostic workflow
        run: rm .github/workflows/flutter-test-diagnostics.yml

      - name: Commit and push repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/widget_test.dart .github/workflows/flutter-test-diagnostics.yml
          git commit -m 'test: isolate HomeScreen notification state'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
