name: Repair HomeScreen test cleanup

on:
  push:
    branches:
      - fix/v0.6.3-release-gate

permissions:
  contents: write

concurrency:
  group: repair-home-test-cleanup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-home-test-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: fix/v0.6.3-release-gate
          fetch-depth: 0

      - name: Close widget-test AppState instances
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('test/widget_test.dart')
          text = path.read_text(encoding='utf-8')

          prefs_before = """      SharedPreferences.setMockInitialValues({
  'onboarding_completed_v1': true,
  'notification_info_shown_v1': true,
});"""
          prefs_after = """      SharedPreferences.setMockInitialValues({
        'onboarding_completed_v1': true,
        'notification_info_shown_v1': true,
      });"""
          if prefs_before not in text:
              raise SystemExit('HomeScreen preference formatting target was not found')
          text = text.replace(prefs_before, prefs_after, 1)

          helper_before = "  await appState.load();\n  return appState;"
          helper_after = "  await appState.load();\n  addTearDown(appState.close);\n  return appState;"
          if helper_before not in text:
              raise SystemExit('AppState helper cleanup target was not found')
          text = text.replace(helper_before, helper_after, 1)

          first_before = "      await appState.load();\n\n      await tester.pumpWidget("
          first_after = "      await appState.load();\n      addTearDown(appState.close);\n\n      await tester.pumpWidget("
          if first_before not in text:
              raise SystemExit('first HomeScreen test cleanup target was not found')
          text = text.replace(first_before, first_after, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary repair workflow
        run: rm .github/workflows/flutter-test-diagnostics.yml

      - name: Commit and push repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/widget_test.dart .github/workflows/flutter-test-diagnostics.yml
          git commit -m 'test: close HomeScreen AppState instances'
          git push origin HEAD:fix/v0.6.3-release-gate
