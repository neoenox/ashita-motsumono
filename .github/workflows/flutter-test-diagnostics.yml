name: Flutter test diagnostics

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  diagnose-widget-test:
    strategy:
      fail-fast: false
      matrix:
        ref:
          - master
          - feat/adaptive-navigation-motion
    runs-on: ubuntu-latest
    steps:
      - name: Check out ${{ matrix.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run isolated widget test
        shell: bash
        run: |
          set +e
          mkdir -p build/diagnostics
          flutter test test/widget_test.dart \
            --plain-name 'shows empty state when children exist but no todos' \
            --timeout 60s \
            --reporter expanded 2>&1 \
            | tee build/diagnostics/flutter-widget-test.txt
          status=${PIPESTATUS[0]}
          echo "$status" > build/diagnostics/flutter-widget-test-status.txt
          exit 0

      - name: Upload widget test diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: flutter-widget-test-diagnostics-${{ strategy.job-index }}
          path: build/diagnostics/
          if-no-files-found: error
          retention-days: 1

      - name: Fail when widget test failed
        shell: bash
        run: |
          status="$(cat build/diagnostics/flutter-widget-test-status.txt)"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
