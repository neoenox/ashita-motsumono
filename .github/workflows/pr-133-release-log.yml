name: Capture PR 133 release failure log

on:
  push:
    branches:
      - fix/v0.6.3-release-gate
    paths:
      - .github/workflows/pr-133-release-log.yml

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  capture-log:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish capture run link
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -n \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:"pending", target_url:$target_url, description:"Capturing latest release build failure log", context:"pr-133-release-log"}' \
            > status.json
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --input status.json

      - name: Download failed release validation job log
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/ci-diagnostics
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/jobs/89789975910/logs" \
            > build/ci-diagnostics/release-validation-job.log
          tail -n 220 build/ci-diagnostics/release-validation-job.log

      - name: Upload failed release validation log
        uses: actions/upload-artifact@v4
        with:
          name: pr-133-release-validation-job-log-latest
          path: build/ci-diagnostics/release-validation-job.log
          retention-days: 7

      - name: Publish capture success
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -n \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:"success", target_url:$target_url, description:"Latest release build failure log captured", context:"pr-133-release-log"}' \
            > status.json
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --input status.json
