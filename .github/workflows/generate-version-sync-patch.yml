name: Generate version sync patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Add package info dependency
        run: flutter pub add package_info_plus:^8.3.1

      - name: Apply settings version patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/src/screens/settings_screen.dart')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "import 'package:flutter/material.dart';\n",
                  "import 'package:flutter/material.dart';\n"
                  "import 'package:package_info_plus/package_info_plus.dart';\n",
              ),
              (
                  "class _SettingsScreenState extends State<SettingsScreen> {\n"
                  "  AppSettings get settings => widget.settings;\n",
                  "class _SettingsScreenState extends State<SettingsScreen> {\n"
                  "  AppSettings get settings => widget.settings;\n"
                  "  late final Future<String?> _versionLabel;\n\n"
                  "  @override\n"
                  "  void initState() {\n"
                  "    super.initState();\n"
                  "    _versionLabel = _loadVersionLabel();\n"
                  "  }\n",
              ),
              (
                  "          Center(\n"
                  "            child: Text(\n"
                  "              'Version 0.6.2',\n"
                  "              style: TextStyle(\n"
                  "                color: cs.onSurfaceVariant.withValues(alpha: 0.5),\n"
                  "                fontSize: 12,\n"
                  "              ),\n"
                  "            ),\n"
                  "          ),\n",
                  "          _AppVersionLabel(\n"
                  "            versionLabel: _versionLabel,\n"
                  "            textColor: cs.onSurfaceVariant.withValues(alpha: 0.5),\n"
                  "          ),\n",
              ),
              (
                  "  Future<void> _openExternalPage(\n",
                  "  Future<String?> _loadVersionLabel() async {\n"
                  "    try {\n"
                  "      final packageInfo = await PackageInfo.fromPlatform();\n"
                  "      return formatAppVersion(packageInfo);\n"
                  "    } on Object {\n"
                  "      return null;\n"
                  "    }\n"
                  "  }\n\n"
                  "  Future<void> _openExternalPage(\n",
              ),
              (
                  "class _SettingsBottomNav extends StatelessWidget {\n",
                  "class _AppVersionLabel extends StatelessWidget {\n"
                  "  const _AppVersionLabel({\n"
                  "    required this.versionLabel,\n"
                  "    required this.textColor,\n"
                  "  });\n\n"
                  "  final Future<String?> versionLabel;\n"
                  "  final Color textColor;\n\n"
                  "  @override\n"
                  "  Widget build(BuildContext context) {\n"
                  "    return FutureBuilder<String?>(\n"
                  "      future: versionLabel,\n"
                  "      builder: (context, snapshot) {\n"
                  "        final label = snapshot.data;\n"
                  "        if (label == null || label.isEmpty) {\n"
                  "          return const SizedBox.shrink();\n"
                  "        }\n"
                  "        return Center(\n"
                  "          child: Text(\n"
                  "            label,\n"
                  "            style: TextStyle(color: textColor, fontSize: 12),\n"
                  "          ),\n"
                  "        );\n"
                  "      },\n"
                  "    );\n"
                  "  }\n"
                  "}\n\n"
                  "class _SettingsBottomNav extends StatelessWidget {\n",
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected settings snippet not found: {old[:80]!r}')
              text = text.replace(old, new, 1)

          format_marker = "final _themeModes = {\n"
          formatter = (
              "@visibleForTesting\n"
              "String formatAppVersion(PackageInfo packageInfo) {\n"
              "  final version = packageInfo.version.trim();\n"
              "  final buildNumber = packageInfo.buildNumber.trim();\n"
              "  if (version.isEmpty) return '';\n"
              "  if (buildNumber.isEmpty) return 'Version $version';\n"
              "  return 'Version $version+$buildNumber';\n"
              "}\n\n"
          )
          if format_marker not in text:
              raise SystemExit('Theme map marker not found')
          text = text.replace(format_marker, formatter + format_marker, 1)
          path.write_text(text, encoding='utf-8')

          test_path = Path('test/settings_version_test.dart')
          test_path.write_text(
              "import 'package:ashita_motsumono/src/screens/settings_screen.dart';\n"
              "import 'package:flutter_test/flutter_test.dart';\n"
              "import 'package:package_info_plus/package_info_plus.dart';\n\n"
              "void main() {\n"
              "  test('formats package version and build number', () {\n"
              "    final info = PackageInfo(\n"
              "      appName: 'Ashita Motsumono',\n"
              "      packageName: 'com.ashita_motsumono',\n"
              "      version: '0.6.3',\n"
              "      buildNumber: '2',\n"
              "    );\n\n"
              "    expect(formatAppVersion(info), 'Version 0.6.3+2');\n"
              "  });\n\n"
              "  test('omits separator when build number is empty', () {\n"
              "    final info = PackageInfo(\n"
              "      appName: 'Ashita Motsumono',\n"
              "      packageName: 'com.ashita_motsumono',\n"
              "      version: '0.6.3',\n"
              "      buildNumber: '',\n"
              "    );\n\n"
              "    expect(formatAppVersion(info), 'Version 0.6.3');\n"
              "  });\n"
              "}\n",
              encoding='utf-8',
          )

      - name: Format generated Dart files
        run: dart format lib/src/screens/settings_screen.dart test/settings_version_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test version formatting
        run: flutter test test/settings_version_test.dart

      - name: Commit generated patch
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml pubspec.lock lib/src/screens/settings_screen.dart test/settings_version_test.dart
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "fix: display app version from package metadata"
          git push origin "HEAD:${HEAD_BRANCH}"
