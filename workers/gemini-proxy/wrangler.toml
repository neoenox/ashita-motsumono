name = "ashita-gemini-proxy"
main = "src/validated.ts"
compatibility_date = "2026-07-10"

[vars]
ANDROID_PACKAGE_NAME = "com.ashita_motsumono"
IOS_BUNDLE_ID = "com.ashita_motsumono"
REMOVE_ADS_PRODUCT_ID = "remove_ads"
AI_ACCESS_PRODUCT_ID = "ai_analysis"
MAX_IMAGE_BYTES = "5242880"

# Atomic per-identity daily quota counter for /analyze (issue #211). Durable
# Objects require a Workers Paid plan; without this binding the worker falls
# back to the optional AI_DAILY_QUOTA KV namespace below.
[durable_objects]
bindings = [{ name = "AI_QUOTA_COUNTER", class_name = "QuotaCounter" }]

[[migrations]]
tag = "v1"
new_classes = ["QuotaCounter"]

[[unsafe.bindings]]
name = "AI_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[unsafe.bindings]]
name = "ENTITLEMENT_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

# Optional: enables the AI daily usage quota (see README). Replace the id with
# a real KV namespace id before uncommenting.
# [[kv_namespaces]]
# binding = "AI_DAILY_QUOTA"
# id = "<unique-kv-namespace-id>"
